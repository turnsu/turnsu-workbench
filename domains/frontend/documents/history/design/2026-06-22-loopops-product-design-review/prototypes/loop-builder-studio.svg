<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Loop Builder Studio prototype</title>
  <desc id="desc">A composition-first loop builder with skill package chain and background runner status.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f9}.surface{fill:#fff}.soft{fill:#f1f3f6}.line{stroke:#d8dde5;stroke-width:1}.text{fill:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}.muted{fill:#6b7280}.tiny{font-size:12px}.body{font-size:14px}.h1{font-size:27px;font-weight:700}.h2{font-size:18px;font-weight:700}.h3{font-size:14px;font-weight:700}.blue{fill:#0a84ff}.green{fill:#34c759}.amber{fill:#b7791f}.shadow{filter:drop-shadow(0 10px 22px rgba(18,30,50,.08))}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1024"/>
  <rect x="34" y="30" width="1372" height="70" rx="24" class="surface shadow"/>
  <text x="66" y="74" class="text h1">Loop Builder Studio</text>
  <text x="360" y="73" class="text body muted">Compose logs, skills, gates and exit conditions without exposing providers.</text>
  <rect x="1188" y="48" width="88" height="34" rx="17" class="soft"/><text x="1212" y="70" class="text tiny muted">Draft</text>
  <rect x="1288" y="48" width="90" height="34" rx="17" class="blue"/><text x="1316" y="70" class="text tiny" fill="#fff">Save</text>

  <rect x="34" y="124" width="282" height="858" rx="24" class="surface shadow"/>
  <text x="64" y="164" class="text h2">Starter Loops</text>
  <text x="64" y="188" class="text tiny muted">Start from a domain pattern</text>
  <rect x="64" y="222" width="222" height="78" rx="16" fill="#e8f1ff" stroke="#8ab8ff"/>
  <text x="86" y="250" class="text h3">Crypto Market Loop</text>
  <text x="86" y="274" class="text tiny muted">CMC + context + review</text>
  <rect x="64" y="314" width="222" height="78" rx="16" class="soft"/>
  <text x="86" y="342" class="text h3">Earnings Review</text>
  <text x="86" y="366" class="text tiny muted">Markets research draft</text>
  <rect x="64" y="406" width="222" height="78" rx="16" class="soft"/>
  <text x="86" y="434" class="text h3">Meeting Minutes</text>
  <text x="86" y="458" class="text tiny muted">Cloud ASR + document</text>

  <text x="64" y="544" class="text h2">Loop Properties</text>
  <text x="64" y="584" class="text tiny muted">Name</text>
  <rect x="64" y="598" width="222" height="42" rx="12" class="soft"/><text x="82" y="624" class="text body">BTC risk monitor</text>
  <text x="64" y="672" class="text tiny muted">Run mode</text>
  <rect x="64" y="686" width="102" height="36" rx="18" class="blue"/><text x="91" y="708" class="text tiny" fill="#fff">Manual</text>
  <rect x="176" y="686" width="110" height="36" rx="18" class="soft"/><text x="210" y="708" class="text tiny muted">Schedule</text>
  <text x="64" y="770" class="text tiny muted">Visibility</text>
  <rect x="64" y="784" width="222" height="42" rx="12" class="soft"/><text x="82" y="810" class="text body">Private · share log only</text>

  <rect x="340" y="124" width="732" height="858" rx="24" class="surface shadow"/>
  <text x="372" y="164" class="text h2">Skill Chain</text>
  <text x="372" y="188" class="text body muted">Each step is user-readable. Runtime routing stays in the backend.</text>

  <rect x="372" y="232" width="650" height="92" rx="18" class="soft"/>
  <circle cx="412" cy="278" r="18" fill="#e8f1ff"/><text x="406" y="284" class="text h3 blue">1</text>
  <text x="452" y="266" class="text h3">Collect input logs</text>
  <text x="452" y="290" class="text body muted">Use CMC returned result, WeChat context, and previous run notes.</text>
  <rect x="858" y="258" width="126" height="34" rx="17" fill="#fff"/><text x="886" y="280" class="text tiny muted">Configured</text>

  <rect x="372" y="346" width="650" height="92" rx="18" class="soft"/>
  <circle cx="412" cy="392" r="18" fill="#e8f1ff"/><text x="406" y="398" class="text h3 blue">2</text>
  <text x="452" y="380" class="text h3">Run market scanner</text>
  <text x="452" y="404" class="text body muted">Market regime, thesis evidence, opportunity funnel.</text>
  <rect x="858" y="372" width="126" height="34" rx="17" fill="#fff"/><text x="888" y="394" class="text tiny muted">CMC Skill Hub</text>

  <rect x="372" y="460" width="650" height="92" rx="18" class="soft"/>
  <circle cx="412" cy="506" r="18" fill="#e8f1ff"/><text x="406" y="512" class="text h3 blue">3</text>
  <text x="452" y="494" class="text h3">Apply feedback gate</text>
  <text x="452" y="518" class="text body muted">No concrete prices unless returned by provider or structured snapshot.</text>
  <rect x="858" y="486" width="126" height="34" rx="17" fill="#fff8e8"/><text x="895" y="508" class="text tiny amber">Review</text>

  <rect x="372" y="574" width="650" height="92" rx="18" class="soft"/>
  <circle cx="412" cy="620" r="18" fill="#e8f1ff"/><text x="406" y="626" class="text h3 blue">4</text>
  <text x="452" y="608" class="text h3">Write output shape</text>
  <text x="452" y="632" class="text body muted">Candidate funnel, missing inputs, next check, human review list.</text>
  <rect x="858" y="600" width="126" height="34" rx="17" fill="#fff"/><text x="897" y="622" class="text tiny muted">Final</text>

  <text x="372" y="728" class="text h2">Gate &amp; Exit</text>
  <rect x="372" y="756" width="300" height="118" rx="18" fill="#fff8e8" stroke="#ead49a"/>
  <text x="396" y="786" class="text h3">Feedback gate</text>
  <text x="396" y="816" class="text body muted">If evidence is empty, output wait state and review tasks.</text>
  <rect x="692" y="756" width="330" height="118" rx="18" fill="#eef8f0" stroke="#b9dfc1"/>
  <text x="716" y="786" class="text h3">Exit condition</text>
  <text x="716" y="816" class="text body muted">A clean final answer plus cloneable run log.</text>

  <rect x="1100" y="124" width="306" height="858" rx="24" class="surface shadow"/>
  <text x="1130" y="164" class="text h2">Runner Preview</text>
  <text x="1130" y="188" class="text tiny muted">What will happen after Run</text>
  <rect x="1130" y="230" width="246" height="64" rx="16" class="soft"/>
  <circle cx="1154" cy="262" r="7" class="green"/><text x="1174" y="258" class="text h3">Background safe</text><text x="1174" y="278" class="text tiny muted">No external actions</text>
  <rect x="1130" y="314" width="246" height="64" rx="16" class="soft"/>
  <circle cx="1154" cy="346" r="7" class="blue"/><text x="1174" y="342" class="text h3">Review required</text><text x="1174" y="362" class="text tiny muted">Before delivery or trade use</text>
  <rect x="1130" y="398" width="246" height="64" rx="16" class="soft"/>
  <circle cx="1154" cy="430" r="7" class="amber"/><text x="1174" y="426" class="text h3">Share log only</text><text x="1174" y="446" class="text tiny muted">No raw provider fields</text>
  <line x1="1130" y1="514" x2="1376" y2="514" class="line"/>
  <text x="1130" y="554" class="text h3">Output preview</text>
  <text x="1130" y="584" class="text body muted">A compact markdown final answer, evidence gaps, and next loop suggestions.</text>
  <rect x="1130" y="690" width="246" height="44" rx="14" class="blue"/><text x="1206" y="718" class="text h3" fill="#fff">Run loop</text>
  <rect x="1130" y="750" width="246" height="44" rx="14" class="soft"/><text x="1194" y="778" class="text h3">Save draft</text>
</svg>
