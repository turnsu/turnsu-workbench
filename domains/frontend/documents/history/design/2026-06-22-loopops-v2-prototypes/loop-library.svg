  <text class="muted small" x="368" y="464">Markets · saved starter · v1</text>
  <rect class="soft" x="344" y="516" width="460" height="90" rx="16"/>
  <text class="section text" x="368" y="546">Meeting Minutes</text>
  <text class="muted small" x="368" y="570">Office · cloud transcription · v3</text>

  <rect class="surface" x="858" y="132" width="542" height="718" rx="20"/>
