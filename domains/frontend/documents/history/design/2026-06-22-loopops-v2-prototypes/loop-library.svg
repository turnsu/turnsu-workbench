  <text class="body text" x="912" y="330">Trigger: manual or scheduled market check</text>
  <text class="body text" x="912" y="356">Gate: review before action</text>
  <text class="body text" x="912" y="382">Exit: candidate funnel and next checks</text>

  <rect class="soft" x="888" y="426" width="482" height="128" rx="16"/>
  <text class="section text" x="912" y="456">Latest Run Ledger</text>
