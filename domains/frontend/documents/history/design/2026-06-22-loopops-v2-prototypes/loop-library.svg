  <rect class="soft" x="1144" y="592" width="150" height="42" rx="14"/>
  <text class="body text" x="1170" y="619">Share-safe log</text>

  <text class="label muted" x="888" y="686">CHAT HISTORY</text>
  <rect class="soft" x="888" y="704" width="482" height="78" rx="16"/>
  <text class="body text" x="912" y="736">This loop was created from a chat request and revised twice.</text>
  <text class="muted small" x="912" y="760">Open Builder Chat to continue editing.</text>
