  <text class="body text" x="912" y="512">Review: needs human decision</text>
  <text class="muted small" x="912" y="536">Share-safe log omits private inputs and sensitive notes.</text>

  <rect class="blue" x="888" y="592" width="112" height="42" rx="14"/>
  <text x="918" y="619" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="14" font-weight="700">Replay</text>
  <rect class="soft" x="1016" y="592" width="112" height="42" rx="14"/>
