  <rect class="blueSoft" x="344" y="198" width="460" height="90" rx="16"/>
  <text class="section text" x="368" y="228">Market Report Loop</text>
  <text class="muted small" x="368" y="252">Crypto · manual or scheduled · v4</text>
  <rect class="green" x="368" y="260" width="86" height="22" rx="10"/>
  <text class="small text" x="386" y="276">Runnable</text>
  <rect class="soft" x="344" y="304" width="460" height="90" rx="16"/>
  <text class="section text" x="368" y="334">BTC Thesis Review</text>
  <text class="muted small" x="368" y="358">Crypto · review-only · v2</text>
  <rect class="amber" x="368" y="366" width="104" height="22" rx="10"/>
