  <text class="body text" x="68" y="490">Crypto</text>
  <text class="body text" x="68" y="526">Markets</text>
  <text class="body text" x="68" y="562">Office</text>

  <rect class="surface" x="314" y="132" width="520" height="718" rx="20"/>
