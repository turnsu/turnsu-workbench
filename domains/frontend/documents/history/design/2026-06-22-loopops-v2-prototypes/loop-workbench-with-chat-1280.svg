<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .surface { fill: #ffffff; stroke: #d9dce3; stroke-width: 1; }
      .soft { fill: #f7f8fa; stroke: #dde1e7; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .blueSoft { fill: #eaf3ff; stroke: #b8d7ff; stroke-width: 1; }
      .amber { fill: #fff4d8; stroke: #f0d58b; stroke-width: 1; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .muted { fill: #6b7280; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .title { font-size: 22px; font-weight: 700; }
      .section { font-size: 15px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="800"/>
  <rect class="surface" x="28" y="22" width="1224" height="56" rx="18"/>
  <text class="muted body" x="58" y="57">Ask, run a loop, search Library…</text>
  <text class="muted small" x="1048" y="57">Workbench   Library   Studio</text>

  <rect class="surface" x="28" y="104" width="280" height="488" rx="20"/>
  <text class="section text" x="52" y="138">Loop Shelf</text>
  <rect class="blueSoft" x="52" y="156" width="68" height="30" rx="10"/>
  <text class="label text" x="72" y="176">Crypto</text>
  <rect class="soft" x="128" y="156" width="76" height="30" rx="10"/>
  <text class="label muted" x="146" y="176">Markets</text>
  <rect class="soft" x="212" y="156" width="64" height="30" rx="10"/>
  <text class="label muted" x="230" y="176">Office</text>

  <text class="label muted" x="52" y="220">SAVED</text>
  <rect class="blueSoft" x="52" y="236" width="226" height="70" rx="14"/>
  <text class="section text" x="72" y="263">Market Report Loop</text>
  <text class="muted small" x="72" y="284">Current default loop</text>
  <rect class="soft" x="52" y="318" width="226" height="64" rx="14"/>
  <text class="section text" x="72" y="345">Thesis Review</text>
  <text class="muted small" x="72" y="366">Review-only</text>
  <text class="label muted" x="52" y="418">ACTIVE</text>
  <rect class="amber" x="52" y="434" width="226" height="72" rx="14"/>
  <text class="section text" x="72" y="460">BTC market loop</text>
  <text class="muted small" x="72" y="482">Needs review</text>

  <rect class="surface" x="332" y="104" width="920" height="488" rx="20"/>
  <text class="title text" x="362" y="148">Market Report Loop</text>
  <text class="muted body" x="362" y="174">One final answer, timeline, data notes, review boundary.</text>
  <rect class="soft" x="362" y="204" width="860" height="94" rx="16"/>
  <text class="section text" x="384" y="232">Final Answer</text>
  <text class="body text" x="384" y="260">Defensive-neutral. No immediate execution path. Continue with evidence review.</text>
  <rect class="soft" x="362" y="320" width="410" height="116" rx="16"/>
  <text class="section text" x="384" y="348">Candidate Funnel</text>
  <text class="body text" x="384" y="378">BTC: review · ETH: wait · SOL: rejected</text>
  <rect class="soft" x="792" y="320" width="430" height="116" rx="16"/>
  <text class="section text" x="814" y="348">Review Packet</text>
  <text class="body text" x="814" y="378">Claims: 3 · Gaps: 2 · Blocked actions: trading</text>
  <rect class="blue" x="362" y="462" width="120" height="40" rx="14"/>
  <text x="394" y="488" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="14" font-weight="700">Review</text>
  <rect class="soft" x="498" y="462" width="120" height="40" rx="14"/>
  <text class="body text" x="522" y="488">Follow-up</text>
  <rect class="soft" x="634" y="462" width="120" height="40" rx="14"/>
  <text class="body text" x="668" y="488">Fork</text>

  <rect class="surface" x="28" y="616" width="1224" height="146" rx="20"/>
  <text class="section text" x="58" y="650">Run Chat</text>
  <text class="muted small" x="148" y="650">Compact drawer in 1280 width, scoped to selected run</text>
  <rect class="soft" x="58" y="674" width="500" height="54" rx="14"/>
  <text class="body text" x="78" y="707">Ask why this run is review-only…</text>
  <rect class="blueSoft" x="580" y="674" width="196" height="54" rx="14"/>
  <text class="body text" x="606" y="707">Explain evidence gaps</text>
  <rect class="soft" x="792" y="674" width="172" height="54" rx="14"/>
  <text class="body text" x="824" y="707">Create follow-up</text>
  <rect class="soft" x="980" y="674" width="220" height="54" rx="14"/>
  <text class="body text" x="1016" y="707">Save as loop draft</text>
</svg>
