<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .sidebar { fill: #ecedf1; }
      .surface { fill: #ffffff; stroke: #d9dce3; stroke-width: 1; }
      .soft { fill: #f7f8fa; stroke: #dde1e7; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .blueSoft { fill: #eaf3ff; stroke: #b8d7ff; stroke-width: 1; }
      .green { fill: #e8f7ee; stroke: #b7e2c5; stroke-width: 1; }
      .amber { fill: #fff4d8; stroke: #f0d58b; stroke-width: 1; }
      .red { fill: #fff0f0; stroke: #efb9b9; stroke-width: 1; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .muted { fill: #6b7280; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 15px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="sidebar" x="0" y="0" width="76" height="900"/>
  <rect class="surface" x="18" y="28" width="40" height="40" rx="12"/>
  <text class="text" x="30" y="54" font-size="20">∞</text>
  <rect class="blueSoft" x="18" y="108" width="40" height="40" rx="12"/>
  <text class="text" x="30" y="134" font-size="18">⌘</text>
  <rect class="soft" x="18" y="164" width="40" height="40" rx="12"/>
  <text class="muted" x="30" y="190" font-size="17">↺</text>
  <rect class="soft" x="18" y="220" width="40" height="40" rx="12"/>
  <text class="muted" x="31" y="246" font-size="17">⚙</text>

  <rect class="surface" x="96" y="24" width="1316" height="58" rx="18"/>
  <text class="muted body" x="126" y="59">Search loops, runs, files, or ask the assistant…</text>
  <rect class="soft" x="1132" y="36" width="220" height="34" rx="12"/>
  <text class="muted small" x="1152" y="57">Workbench   Library   Studio</text>

  <rect class="surface" x="96" y="106" width="306" height="746" rx="20"/>
  <text class="section text" x="122" y="140">Loop Shelf</text>
  <rect class="blueSoft" x="122" y="158" width="76" height="30" rx="10"/>
  <text class="label text" x="144" y="178">Crypto</text>
  <rect class="soft" x="206" y="158" width="82" height="30" rx="10"/>
  <text class="label muted" x="226" y="178">Markets</text>
  <rect class="soft" x="296" y="158" width="74" height="30" rx="10"/>
  <text class="label muted" x="318" y="178">Office</text>

  <text class="label muted" x="122" y="220">SAVED LOOPS</text>
  <rect class="blueSoft" x="122" y="236" width="254" height="72" rx="14"/>
  <text class="section text" x="142" y="263">Market Report Loop</text>
  <text class="muted small" x="142" y="284">Regime, perp, on-chain scan</text>
  <rect class="green" x="142" y="289" width="68" height="22" rx="10"/>
  <text class="small text" x="155" y="305">Ready</text>

  <rect class="soft" x="122" y="320" width="254" height="72" rx="14"/>
  <text class="section text" x="142" y="347">Thesis Review</text>
  <text class="muted small" x="142" y="368">Support, contradiction, invalidation</text>
  <rect class="amber" x="142" y="373" width="104" height="22" rx="10"/>
  <text class="small text" x="154" y="389">Review-only</text>

  <text class="label muted" x="122" y="426">ACTIVE RUNS</text>
  <rect class="amber" x="122" y="442" width="254" height="76" rx="14"/>
  <text class="section text" x="142" y="468">BTC market loop</text>
  <text class="muted small" x="142" y="489">Needs review after final answer</text>
  <text class="small text" x="142" y="508">Review needed</text>
  <rect class="soft" x="122" y="530" width="254" height="76" rx="14"/>
  <text class="section text" x="142" y="556">Meeting summary</text>
  <text class="muted small" x="142" y="577">Cloud transcript completed</text>
  <text class="small text" x="142" y="596">Completed</text>

  <text class="label muted" x="122" y="638">STARTER LOOPS</text>
  <rect class="soft" x="122" y="654" width="254" height="44" rx="12"/>
  <text class="body text" x="142" y="681">DeFi Opportunity Scan</text>
  <rect class="soft" x="122" y="708" width="254" height="44" rx="12"/>
  <text class="body text" x="142" y="735">Company Deep Dive</text>
  <rect class="soft" x="122" y="762" width="254" height="44" rx="12"/>
  <text class="body text" x="142" y="789">Meeting Minutes</text>

  <rect class="surface" x="426" y="106" width="620" height="746" rx="20"/>
  <text class="title text" x="456" y="150">Market Report Loop</text>
  <text class="muted body" x="456" y="176">Current run: BTC / ETH regime scan · Review-only</text>
  <rect class="green" x="896" y="128" width="112" height="30" rx="14"/>
  <text class="label text" x="922" y="148">Completed</text>

  <rect class="soft" x="456" y="206" width="558" height="96" rx="16"/>
  <text class="section text" x="478" y="234">Final Answer</text>
  <text class="body text" x="478" y="262">Market stance is defensive-neutral. No immediate execution path.</text>
  <text class="muted small" x="478" y="284">One authoritative final answer. Follow-up uses this run context.</text>

  <rect class="soft" x="456" y="322" width="268" height="124" rx="16"/>
  <text class="section text" x="478" y="350">Candidate Funnel</text>
  <text class="body text" x="478" y="380">BTC: thesis review</text>
  <text class="body text" x="478" y="404">ETH: wait for confirmation</text>
  <text class="body text" x="478" y="428">SOL: rejected by risk gate</text>
  <rect class="soft" x="746" y="322" width="268" height="124" rx="16"/>
  <text class="section text" x="768" y="350">Data Notes</text>
  <text class="body text" x="768" y="380">CMC result available</text>
  <text class="body text" x="768" y="404">Prices: bounded by returned text</text>
  <text class="body text" x="768" y="428">No trade execution</text>

  <text class="label muted" x="456" y="482">RUN TIMELINE</text>
  <line x1="486" y1="526" x2="984" y2="526" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="486" cy="526" r="10" fill="#34c759"/>
  <circle cx="650" cy="526" r="10" fill="#34c759"/>
  <circle cx="814" cy="526" r="10" fill="#34c759"/>
  <circle cx="984" cy="526" r="10" fill="#ffcc00"/>
  <text class="small muted" x="456" y="560">Collect</text>
  <text class="small muted" x="620" y="560">Analyze</text>
  <text class="small muted" x="784" y="560">Draft</text>
  <text class="small muted" x="936" y="560">Review</text>

  <rect class="soft" x="456" y="596" width="558" height="112" rx="16"/>
  <text class="section text" x="478" y="624">Review Packet</text>
  <text class="body text" x="478" y="652">Claims: 3 · Evidence gaps: 2 · Blocked actions: trading, publishing</text>
  <text class="muted small" x="478" y="676">Decision required before sharing or turning into a saved loop.</text>

  <rect class="blue" x="456" y="734" width="132" height="42" rx="14"/>
  <text x="486" y="761" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="14" font-weight="700">Review</text>
  <rect class="soft" x="604" y="734" width="132" height="42" rx="14"/>
  <text class="body text" x="628" y="761">Follow-up</text>
  <rect class="soft" x="752" y="734" width="132" height="42" rx="14"/>
  <text class="body text" x="786" y="761">Fork loop</text>

  <rect class="surface" x="1070" y="106" width="342" height="746" rx="20"/>
  <text class="section text" x="1098" y="140">Run Chat</text>
  <text class="muted small" x="1098" y="162">Scoped to selected run</text>
  <rect class="soft" x="1098" y="194" width="252" height="68" rx="16"/>
  <text class="body text" x="1118" y="222">Explain why the stance is defensive.</text>
  <rect class="blueSoft" x="1128" y="286" width="252" height="92" rx="16"/>
  <text class="body text" x="1148" y="314">The loop found weak confirmation and two missing inputs.</text>
  <text class="muted small" x="1148" y="340">Use Review to inspect the gaps.</text>
  <text class="label muted" x="1098" y="426">SUGGESTED NEXT</text>
  <rect class="soft" x="1098" y="444" width="280" height="44" rx="12"/>
  <text class="body text" x="1118" y="472">Ask for missing evidence</text>
  <rect class="soft" x="1098" y="500" width="280" height="44" rx="12"/>
  <text class="body text" x="1118" y="528">Create Thesis Review follow-up</text>
  <rect class="soft" x="1098" y="556" width="280" height="44" rx="12"/>
  <text class="body text" x="1118" y="584">Save as reusable loop</text>
  <rect class="soft" x="1098" y="720" width="280" height="92" rx="16"/>
  <text class="muted body" x="1118" y="756">Ask about this run…</text>
  <circle class="blue" cx="1350" cy="766" r="18"/>
  <text x="1345" y="772" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="16">↑</text>
</svg>
