<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .surface { fill: #ffffff; stroke: #d9dce3; stroke-width: 1; }
      .soft { fill: #f7f8fa; stroke: #dde1e7; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .blueSoft { fill: #eaf3ff; stroke: #b8d7ff; stroke-width: 1; }
      .green { fill: #e8f7ee; stroke: #b7e2c5; stroke-width: 1; }
      .amber { fill: #fff4d8; stroke: #f0d58b; stroke-width: 1; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .muted { fill: #6b7280; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 15px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="surface" x="40" y="34" width="1360" height="72" rx="22"/>
  <text class="title text" x="72" y="78">Run Chat Detail</text>
  <text class="muted body" x="294" y="78">BTC Market Report Loop · scoped chat, review packet, one final answer</text>
  <rect class="amber" x="1248" y="54" width="116" height="32" rx="14"/>
  <text class="label text" x="1274" y="75">Review needed</text>

  <rect class="surface" x="40" y="134" width="640" height="714" rx="20"/>
  <text class="section text" x="70" y="170">Final Answer</text>
  <rect class="soft" x="70" y="192" width="580" height="136" rx="16"/>
  <text class="body text" x="94" y="224">The loop finds defensive-neutral conditions.</text>
  <text class="body text" x="94" y="252">There is no clean execution path until missing inputs clear.</text>
  <text class="muted small" x="94" y="284">Final answer source: authoritative run read model.</text>

  <text class="label muted" x="70" y="366">TIMELINE</text>
  <rect class="soft" x="70" y="386" width="580" height="150" rx="16"/>
  <circle cx="102" cy="422" r="8" fill="#34c759"/>
  <text class="body text" x="124" y="427">Collected market and context inputs</text>
  <circle cx="102" cy="458" r="8" fill="#34c759"/>
  <text class="body text" x="124" y="463">Analyzed regime and candidates</text>
  <circle cx="102" cy="494" r="8" fill="#34c759"/>
  <text class="body text" x="124" y="499">Drafted final answer</text>
  <circle cx="102" cy="530" r="8" fill="#ffcc00"/>
  <text class="body text" x="124" y="535">Waiting for human review</text>

  <text class="label muted" x="70" y="574">REVIEW PACKET</text>
  <rect class="soft" x="70" y="594" width="278" height="126" rx="16"/>
  <text class="section text" x="92" y="622">Evidence Gaps</text>
  <text class="body text" x="92" y="652">Perp confirmation missing</text>
  <text class="body text" x="92" y="678">Spot flow unclear</text>
  <rect class="soft" x="372" y="594" width="278" height="126" rx="16"/>
  <text class="section text" x="394" y="622">Blocked Actions</text>
  <text class="body text" x="394" y="652">Trading execution</text>
  <text class="body text" x="394" y="678">External posting</text>

  <rect class="blue" x="70" y="758" width="120" height="42" rx="14"/>
  <text x="100" y="785" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="14" font-weight="700">Reviewed</text>
  <rect class="soft" x="206" y="758" width="132" height="42" rx="14"/>
  <text class="body text" x="232" y="785">Ask gap</text>
  <rect class="soft" x="354" y="758" width="132" height="42" rx="14"/>
  <text class="body text" x="382" y="785">Fork run</text>

  <rect class="surface" x="704" y="134" width="696" height="714" rx="20"/>
  <text class="section text" x="734" y="170">Run Chat</text>
  <text class="muted small" x="820" y="170">Every message is scoped to this run</text>

  <rect class="soft" x="734" y="206" width="430" height="64" rx="16"/>
  <text class="body text" x="756" y="234">Why did the loop reject SOL?</text>
  <text class="muted small" x="756" y="252">User</text>
  <rect class="blueSoft" x="864" y="294" width="476" height="112" rx="16"/>
  <text class="body text" x="888" y="324">SOL was rejected because the run found conflict between</text>
  <text class="body text" x="888" y="350">momentum and confirmation. It should remain in watch mode.</text>
  <text class="muted small" x="888" y="376">Assistant · based on this run</text>
  <rect class="soft" x="734" y="438" width="430" height="64" rx="16"/>
  <text class="body text" x="756" y="466">Create a follow-up Thesis Review for BTC only.</text>
  <text class="muted small" x="756" y="484">User</text>
  <rect class="blueSoft" x="864" y="526" width="476" height="104" rx="16"/>
  <text class="body text" x="888" y="556">Drafted follow-up loop: BTC Thesis Review.</text>
  <text class="body text" x="888" y="582">It will preserve review-only boundaries.</text>
  <text class="muted small" x="888" y="608">Ready to run or save</text>

  <text class="label muted" x="734" y="676">SUGGESTIONS</text>
  <rect class="soft" x="734" y="696" width="188" height="42" rx="14"/>
  <text class="body text" x="760" y="723">Run follow-up</text>
  <rect class="soft" x="938" y="696" width="188" height="42" rx="14"/>
  <text class="body text" x="964" y="723">Save loop draft</text>
  <rect class="soft" x="1142" y="696" width="198" height="42" rx="14"/>
  <text class="body text" x="1166" y="723">Open in Studio</text>

  <rect class="soft" x="734" y="766" width="606" height="50" rx="16"/>
  <text class="muted body" x="756" y="797">Ask about the selected run…</text>
  <circle class="blue" cx="1306" cy="791" r="17"/>
  <text x="1301" y="797" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="16">↑</text>
</svg>
