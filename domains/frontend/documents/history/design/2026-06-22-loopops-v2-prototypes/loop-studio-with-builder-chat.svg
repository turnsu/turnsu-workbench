<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .surface { fill: #ffffff; stroke: #d9dce3; stroke-width: 1; }
      .soft { fill: #f7f8fa; stroke: #dde1e7; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .blueSoft { fill: #eaf3ff; stroke: #b8d7ff; stroke-width: 1; }
      .green { fill: #e8f7ee; stroke: #b7e2c5; stroke-width: 1; }
      .amber { fill: #fff4d8; stroke: #f0d58b; stroke-width: 1; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .muted { fill: #6b7280; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 15px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="surface" x="40" y="32" width="1360" height="72" rx="22"/>
  <text class="title text" x="72" y="76">Loop Studio</text>
  <text class="muted body" x="222" y="76">Build and edit a Loop Contract with Builder Chat</text>
  <rect class="blue" x="1248" y="52" width="116" height="34" rx="14"/>
  <text x="1280" y="74" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="13" font-weight="700">Save Loop</text>

  <rect class="surface" x="40" y="132" width="392" height="718" rx="20"/>
  <text class="section text" x="70" y="168">Loop Contract</text>
  <text class="label muted" x="70" y="210">NAME</text>
  <rect class="soft" x="70" y="224" width="332" height="46" rx="12"/>
  <text class="body text" x="92" y="253">Morning Market Scan</text>
  <text class="label muted" x="70" y="304">DOMAIN</text>
  <rect class="blueSoft" x="70" y="318" width="92" height="34" rx="12"/>
  <text class="body text" x="94" y="340">Crypto</text>
  <rect class="soft" x="170" y="318" width="96" height="34" rx="12"/>
  <text class="body muted" x="194" y="340">Markets</text>
  <rect class="soft" x="274" y="318" width="88" height="34" rx="12"/>
  <text class="body muted" x="296" y="340">Office</text>
  <text class="label muted" x="70" y="390">GOAL</text>
  <rect class="soft" x="70" y="404" width="332" height="86" rx="12"/>
  <text class="body text" x="92" y="434">Scan market regime and create a</text>
  <text class="body text" x="92" y="460">review-only candidate funnel.</text>
  <text class="label muted" x="70" y="526">TRIGGER</text>
  <rect class="soft" x="70" y="540" width="332" height="46" rx="12"/>
  <text class="body text" x="92" y="569">Manual or weekdays 09:00</text>
  <text class="label muted" x="70" y="622">OUTPUT SHAPE</text>
  <rect class="soft" x="70" y="636" width="332" height="86" rx="12"/>
  <text class="body text" x="92" y="666">Stance, candidate funnel, gaps,</text>
  <text class="body text" x="92" y="692">next review questions.</text>

  <rect class="surface" x="456" y="132" width="466" height="718" rx="20"/>
  <text class="section text" x="486" y="168">Steps, Gate, Exit</text>
  <rect class="soft" x="486" y="202" width="406" height="94" rx="16"/>
  <text class="label muted" x="510" y="230">STEP 1</text>
  <text class="body text" x="510" y="258">Collect market and context inputs</text>
  <rect class="soft" x="486" y="318" width="406" height="94" rx="16"/>
  <text class="label muted" x="510" y="346">STEP 2</text>
  <text class="body text" x="510" y="374">Run market research capability chain</text>
  <rect class="soft" x="486" y="434" width="406" height="94" rx="16"/>
  <text class="label muted" x="510" y="462">STEP 3</text>
  <text class="body text" x="510" y="490">Draft final answer and review packet</text>
  <rect class="amber" x="486" y="562" width="406" height="94" rx="16"/>
  <text class="label muted" x="510" y="590">FEEDBACK GATE</text>
  <text class="body text" x="510" y="618">Human review before any external action</text>
  <rect class="green" x="486" y="678" width="406" height="94" rx="16"/>
  <text class="label muted" x="510" y="706">EXIT CONDITION</text>
  <text class="body text" x="510" y="734">Final answer plus next checks or no-trade</text>

  <rect class="surface" x="946" y="132" width="454" height="718" rx="20"/>
  <text class="section text" x="976" y="168">Builder Chat</text>
  <text class="muted small" x="1072" y="168">Edits the visible contract</text>
  <rect class="soft" x="976" y="204" width="302" height="68" rx="16"/>
  <text class="body text" x="998" y="232">Make this loop run every weekday morning.</text>
  <text class="muted small" x="998" y="252">User</text>
  <rect class="blueSoft" x="1018" y="296" width="332" height="110" rx="16"/>
  <text class="body text" x="1040" y="326">Updated trigger to weekdays 09:00.</text>
  <text class="body text" x="1040" y="352">Review gate remains required.</text>
  <text class="muted small" x="1040" y="378">Contract changed</text>
  <rect class="soft" x="976" y="442" width="302" height="68" rx="16"/>
  <text class="body text" x="998" y="470">Add a condition to stop if data is stale.</text>
  <text class="muted small" x="998" y="490">User</text>
  <rect class="blueSoft" x="1018" y="534" width="332" height="112" rx="16"/>
  <text class="body text" x="1040" y="564">Added exit: stop and request review when</text>
  <text class="body text" x="1040" y="590">critical inputs are stale or missing.</text>
  <text class="muted small" x="1040" y="616">Validation passed</text>
  <rect class="soft" x="976" y="732" width="374" height="52" rx="16"/>
  <text class="muted body" x="998" y="764">Describe another edit…</text>
  <circle class="blue" cx="1316" cy="758" r="17"/>
  <text x="1311" y="764" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial" font-size="16">↑</text>
</svg>
