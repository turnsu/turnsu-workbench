<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Crypto Answer Loop prototype</title>
  <desc id="desc">Crypto research answer loop with CMC returned result, markdown rendering, follow-up prompts, and actions.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f7f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #8fbaff; stroke-width: 1; }
      .ink { fill: #1d1d20; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .blue { fill: #0a84ff; }
      .green { fill: #34c759; }
      .amber { fill: #ff9f0a; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 18px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .shadow { filter: drop-shadow(0 14px 30px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect width="1440" height="900" class="bg"/>
  <rect x="24" y="24" width="1392" height="852" rx="28" class="panel shadow"/>

  <rect x="60" y="64" width="276" height="756" rx="22" class="soft"/>
  <text x="92" y="108" class="ink h2">Crypto 快捷任务</text>
  <rect x="92" y="148" width="212" height="44" rx="14" class="selected"/>
  <text x="198" y="176" text-anchor="middle" class="ink small" font-weight="650">复核 BTC thesis</text>
  <rect x="92" y="208" width="212" height="44" rx="14" class="panel"/>
  <text x="198" y="236" text-anchor="middle" class="ink small">分析 ETF 流</text>
  <rect x="92" y="268" width="212" height="44" rx="14" class="panel"/>
  <text x="198" y="296" text-anchor="middle" class="ink small">解释 CMC 返回</text>
  <rect x="92" y="328" width="212" height="44" rx="14" class="panel"/>
  <text x="198" y="356" text-anchor="middle" class="ink small">生成跟进任务</text>
  <text x="92" y="468" class="muted small">后台能力</text>
  <rect x="92" y="492" width="212" height="58" rx="15" class="panel"/>
  <circle cx="116" cy="522" r="6" class="green"/>
  <text x="134" y="518" class="ink tiny" font-weight="650">CMC Skill Hub</text>
  <text x="134" y="538" class="muted tiny">ready</text>
  <rect x="92" y="566" width="212" height="58" rx="15" class="panel"/>
  <circle cx="116" cy="596" r="6" class="amber"/>
  <text x="134" y="592" class="ink tiny" font-weight="650">群消息上下文</text>
  <text x="134" y="612" class="muted tiny">按任务调用</text>

  <rect x="368" y="64" width="948" height="596" rx="24" class="panel"/>
  <text x="402" y="108" class="muted tiny">CRYPTO ANSWER</text>
  <text x="402" y="144" class="ink title">BTC ETF 与宏观 thesis 复核</text>
  <rect x="402" y="172" width="126" height="30" rx="11" fill="#eaf8ee"/>
  <text x="465" y="192" text-anchor="middle" class="ink tiny" font-weight="650">CMC ready</text>
  <rect x="540" y="172" width="134" height="30" rx="11" fill="#fff5e5"/>
  <text x="607" y="192" text-anchor="middle" class="ink tiny" font-weight="650">prices limited</text>

  <rect x="402" y="236" width="870" height="132" rx="18" class="soft"/>
  <text x="430" y="274" class="ink h2">CMC 返回摘要</text>
  <text x="430" y="308" class="ink body">ETF 流和美元流动性仍是 BTC 风险偏好的主线，链上信号需要继续观察。</text>
  <text x="430" y="338" class="muted small">App 渲染 CMC 返回内容，不补写未返回的价格区间。</text>

  <text x="402" y="424" class="ink h2">Markdown answer</text>
  <text x="430" y="462" class="ink body">结论：当前 thesis 可以继续观察，但不构成交易建议。</text>
  <text x="430" y="496" class="ink body">关键观察：ETF 流、宏观流动性、链上风险偏好。</text>
  <text x="430" y="530" class="ink body">数据说明：缺少独立结构化价格快照，不输出支撑阻力。</text>

  <rect x="402" y="584" width="144" height="38" rx="13" class="blue"/>
  <text x="474" y="608" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">继续追问</text>
  <rect x="562" y="584" width="144" height="38" rx="13" class="panel"/>
  <text x="634" y="608" text-anchor="middle" class="ink small" font-weight="650">复制结果</text>
  <rect x="722" y="584" width="144" height="38" rx="13" class="panel"/>
  <text x="794" y="608" text-anchor="middle" class="ink small" font-weight="650">保存记录</text>

  <rect x="368" y="690" width="948" height="106" rx="22" class="panel shadow"/>
  <text x="402" y="728" class="muted body">继续问：如果 ETH ETF 预期升温，这个 BTC thesis 如何变化？</text>
  <rect x="1150" y="724" width="124" height="42" rx="15" class="blue"/>
  <text x="1212" y="751" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">发送</text>
</svg>
