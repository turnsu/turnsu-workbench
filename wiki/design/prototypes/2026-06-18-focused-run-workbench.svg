<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Focused Run Workbench prototype</title>
  <desc id="desc">Alternative Blocks Workbench direction focused on one active run with compact block launcher and task-local review.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .surface { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .surface2 { fill: #f8f9fb; stroke: #d9dee7; stroke-width: 1; }
      .selected { fill: #edf4ff; stroke: #7aa7f8; stroke-width: 1.5; }
      .ink { fill: #1f2329; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .blue { fill: #2563eb; }
      .green { fill: #168a4a; }
      .amber { fill: #a16207; }
      .pill { fill: #eef2f7; stroke: #d6dce6; stroke-width: 1; }
      .h1 { font-size: 25px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; font-weight: 500; }
      .small { font-size: 11px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="surface" x="80" y="28" width="1280" height="58" rx="18"/>
  <text class="ink h1" x="112" y="65">Focused Run Workbench</text>
  <rect class="selected" x="1024" y="42" width="88" height="30" rx="11"/>
  <text class="blue body" x="1048" y="62">Crypto</text>
  <rect class="pill" x="1124" y="42" width="92" height="30" rx="11"/>
  <text class="muted body" x="1146" y="62">Markets</text>
  <rect class="pill" x="1228" y="42" width="82" height="30" rx="11"/>
  <text class="muted body" x="1252" y="62">Office</text>

  <rect class="surface" x="80" y="112" width="210" height="640" rx="18"/>
  <text class="ink h2" x="106" y="146">Blocks</text>
  <rect class="selected" x="106" y="170" width="158" height="58" rx="14"/>
  <text class="ink body" x="126" y="195">Crypto</text>
  <text class="muted small" x="126" y="214">3 loops</text>
  <rect class="surface2" x="106" y="242" width="158" height="58" rx="14"/>
  <text class="ink body" x="126" y="267">Markets</text>
  <text class="muted small" x="126" y="286">2 drafts</text>
  <rect class="surface2" x="106" y="314" width="158" height="58" rx="14"/>
  <text class="ink body" x="126" y="339">Office</text>
  <text class="muted small" x="126" y="358">ASR ready</text>
  <text class="ink h2" x="106" y="420">Templates</text>
  <rect class="pill" x="106" y="444" width="158" height="34" rx="12"/>
  <text class="ink body" x="128" y="466">Market scan</text>
  <rect class="pill" x="106" y="488" width="158" height="34" rx="12"/>
  <text class="ink body" x="128" y="510">Thesis review</text>
  <rect class="pill" x="106" y="532" width="158" height="34" rx="12"/>
  <text class="ink body" x="128" y="554">Opportunity</text>

  <rect class="surface" x="314" y="112" width="726" height="640" rx="18"/>
  <text class="muted small" x="346" y="148">CURRENT RUN</text>
  <text class="ink h1" x="346" y="184">BTC thesis loop</text>
  <text class="muted body" x="346" y="212">A focused answer canvas for one long-running analysis or draft.</text>
  <rect class="surface2" x="346" y="252" width="642" height="314" rx="16"/>
  <text class="ink h2" x="374" y="286">Final answer</text>
  <text class="muted body" x="374" y="320">从 AgentFinalReadModel.finalText 渲染当前权威结果。</text>
  <text class="muted body" x="374" y="350">Crypto 任务优先展示 CMC returned result、市场 markdown 和数据说明。</text>
  <text class="muted body" x="374" y="380">Markets 任务展示 research draft、evidence gaps 和 review task。</text>
  <text class="muted body" x="374" y="410">Office 任务展示会议纪要、文档草稿、Cloud ASR 状态和 Feishu preview。</text>
  <rect class="selected" x="346" y="604" width="112" height="38" rx="12"/>
  <text class="blue body" x="378" y="628">Review</text>
  <rect class="pill" x="472" y="604" width="116" height="38" rx="12"/>
  <text class="ink body" x="498" y="628">Continue</text>
  <rect class="pill" x="602" y="604" width="132" height="38" rx="12"/>
  <text class="ink body" x="628" y="628">Refine draft</text>

  <rect class="surface" x="1064" y="112" width="296" height="640" rx="18"/>
  <text class="ink h2" x="1092" y="146">Task-local Review</text>
  <rect class="surface2" x="1092" y="178" width="240" height="112" rx="14"/>
  <text class="ink body" x="1114" y="208">Evidence</text>
  <text class="muted small" x="1114" y="230">CMC result usable</text>
  <text class="muted small" x="1114" y="252">Snapshot empty</text>
  <rect class="surface2" x="1092" y="310" width="240" height="112" rx="14"/>
  <text class="ink body" x="1114" y="340">Policy</text>
  <text class="muted small" x="1114" y="362">No trading command</text>
  <text class="muted small" x="1114" y="384">Feishu confirm gated</text>
  <rect class="surface2" x="1092" y="442" width="240" height="112" rx="14"/>
  <text class="ink body" x="1114" y="472">Memory / Subagents</text>
  <text class="muted small" x="1114" y="494">Read-only status</text>
  <text class="muted small" x="1114" y="516">No live tmux control</text>

  <rect class="surface" x="80" y="778" width="1280" height="74" rx="18"/>
  <text class="muted body" x="112" y="824">Focused composer: continue the current run, request review, or run another selected template...</text>
  <rect class="selected" x="1220" y="794" width="92" height="38" rx="12"/>
  <text class="blue body" x="1250" y="818">Run</text>
</svg>
