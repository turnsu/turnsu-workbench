<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Command Desk prototype</title>
  <desc id="desc">Integrated macOS Agent workbench focused on quick crypto research, office writing, follow-up, and deliverables.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f7f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #8fbaff; stroke-width: 1; }
      .ink { fill: #1d1d20; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .blue { fill: #0a84ff; }
      .green { fill: #34c759; }
      .amber { fill: #ff9f0a; }
      .red { fill: #ff453a; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 18px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .shadow { filter: drop-shadow(0 14px 30px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect width="1440" height="900" class="bg"/>
  <rect x="24" y="24" width="1392" height="852" rx="28" class="panel shadow"/>

  <rect x="52" y="52" width="188" height="796" rx="22" class="soft"/>
  <text x="82" y="94" class="ink title">looloomi</text>
  <rect x="76" y="144" width="132" height="40" rx="12" class="selected"/>
  <text x="142" y="169" text-anchor="middle" class="ink small" font-weight="650">工作台</text>
  <text x="100" y="226" class="muted body">历史</text>
  <text x="100" y="278" class="muted body">设置</text>
  <rect x="76" y="748" width="132" height="48" rx="14" class="panel"/>
  <text x="96" y="777" class="muted tiny">Local private</text>

  <rect x="268" y="52" width="324" height="796" rx="22" class="soft"/>
  <text x="300" y="96" class="ink h2">任务栈</text>
  <text x="300" y="124" class="muted small">只显示正在推进的工作。</text>
  <rect x="300" y="164" width="260" height="92" rx="16" class="selected"/>
  <circle cx="322" cy="193" r="6" class="green"/>
  <text x="340" y="198" class="ink small" font-weight="650">BTC 宏观复核</text>
  <text x="340" y="224" class="muted tiny">Crypto · CMC result ready</text>
  <rect x="300" y="274" width="260" height="86" rx="16" class="panel"/>
  <circle cx="322" cy="303" r="6" class="amber"/>
  <text x="340" y="308" class="ink small" font-weight="650">产品例会提要</text>
  <text x="340" y="334" class="muted tiny">Office · needs review</text>
  <rect x="300" y="378" width="260" height="86" rx="16" class="panel"/>
  <circle cx="322" cy="407" r="6" class="blue"/>
  <text x="340" y="412" class="ink small" font-weight="650">PRD 改写</text>
  <text x="340" y="438" class="muted tiny">Office · draft ready</text>
  <text x="300" y="526" class="ink h2">常用任务</text>
  <rect x="300" y="558" width="260" height="40" rx="13" class="panel"/>
  <text x="326" y="583" class="ink small">复核一个 crypto thesis</text>
  <rect x="300" y="614" width="260" height="40" rx="13" class="panel"/>
  <text x="326" y="639" class="ink small">把会议材料写成提要</text>
  <rect x="300" y="670" width="260" height="40" rx="13" class="panel"/>
  <text x="326" y="695" class="ink small">继续追问当前结果</text>

  <rect x="620" y="52" width="744" height="598" rx="24" class="panel"/>
  <text x="654" y="96" class="muted tiny">CURRENT RESULT</text>
  <text x="654" y="132" class="ink title">BTC 宏观复核</text>
  <rect x="654" y="158" width="126" height="30" rx="11" fill="#e8f1ff"/>
  <text x="717" y="178" text-anchor="middle" class="ink tiny" font-weight="650">Crypto</text>
  <rect x="792" y="158" width="146" height="30" rx="11" fill="#eaf8ee"/>
  <text x="865" y="178" text-anchor="middle" class="ink tiny" font-weight="650">CMC result ready</text>
  <rect x="950" y="158" width="126" height="30" rx="11" fill="#fff5e5"/>
  <text x="1013" y="178" text-anchor="middle" class="ink tiny" font-weight="650">prices limited</text>

  <rect x="654" y="224" width="652" height="220" rx="18" class="soft"/>
  <text x="686" y="264" class="ink h2">市场阅读</text>
  <text x="686" y="300" class="ink body">CMC Skill Hub 返回的摘要支持继续观察 ETF 流、美元流动性和链上风险偏好。</text>
  <text x="686" y="334" class="ink body">当前结论适合做研究复核，不生成入场、止损或支撑阻力。</text>
  <text x="686" y="388" class="muted small">数据说明：App 会展示 CMC 返回内容；结构化价格快照缺失时，只保留原文中已有的价格。</text>

  <text x="654" y="502" class="ink h2">继续追问</text>
  <rect x="654" y="528" width="186" height="40" rx="13" class="panel"/>
  <text x="747" y="553" text-anchor="middle" class="ink small">加入 ETF 流分析</text>
  <rect x="856" y="528" width="186" height="40" rx="13" class="panel"/>
  <text x="949" y="553" text-anchor="middle" class="ink small">解释风险边界</text>
  <rect x="1058" y="528" width="186" height="40" rx="13" class="panel"/>
  <text x="1151" y="553" text-anchor="middle" class="ink small">生成跟进任务</text>

  <rect x="620" y="676" width="744" height="150" rx="24" class="panel shadow"/>
  <rect x="654" y="706" width="172" height="34" rx="12" class="selected"/>
  <text x="740" y="728" text-anchor="middle" class="ink small" font-weight="650">Crypto</text>
  <rect x="838" y="706" width="172" height="34" rx="12" class="soft"/>
  <text x="924" y="728" text-anchor="middle" class="muted small">Office</text>
  <text x="654" y="774" class="muted body">继续问：把 BTC thesis 和 ETH ETF 预期做一个对比...</text>
  <rect x="1180" y="754" width="132" height="44" rx="15" class="blue"/>
  <text x="1246" y="782" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">发送</text>
</svg>
