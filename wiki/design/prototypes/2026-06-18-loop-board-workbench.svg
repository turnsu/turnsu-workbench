<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Loop Board Workbench prototype</title>
  <desc id="desc">Alternative Blocks Workbench direction using loop board columns and a result preview.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .surface { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .surface2 { fill: #f8f9fb; stroke: #d9dee7; stroke-width: 1; }
      .selected { fill: #edf4ff; stroke: #7aa7f8; stroke-width: 1.5; }
      .ink { fill: #1f2329; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .blue { fill: #2563eb; }
      .green { fill: #168a4a; }
      .amber { fill: #a16207; }
      .pill { fill: #eef2f7; stroke: #d6dce6; stroke-width: 1; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; font-weight: 500; }
      .small { font-size: 11px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="surface" x="84" y="28" width="1272" height="58" rx="17"/>
  <text class="ink h1" x="112" y="65">Loop Board Workbench</text>
  <rect class="selected" x="1050" y="42" width="92" height="30" rx="11"/>
  <text class="blue body" x="1074" y="62">Crypto</text>
  <rect class="pill" x="1152" y="42" width="92" height="30" rx="11"/>
  <text class="muted body" x="1174" y="62">Markets</text>
  <rect class="pill" x="1254" y="42" width="82" height="30" rx="11"/>
  <text class="muted body" x="1278" y="62">Office</text>

  <rect class="surface" x="84" y="112" width="908" height="640" rx="18"/>
  <text class="ink h2" x="112" y="146">Loop Board</text>
  <text class="muted body" x="112" y="170">Batch review and parallel loop management.</text>
  <rect class="surface2" x="112" y="204" width="260" height="484" rx="16"/>
  <text class="ink h2" x="136" y="238">Running</text>
  <rect class="surface" x="136" y="268" width="212" height="88" rx="13"/>
  <circle class="amber" cx="156" cy="292" r="5"/>
  <text class="ink body" x="170" y="296">ETH opportunity watch</text>
  <text class="muted small" x="170" y="318">trigger: market scan</text>
  <text class="muted small" x="170" y="338">feedback gate pending</text>
  <rect class="surface" x="136" y="374" width="212" height="88" rx="13"/>
  <circle class="amber" cx="156" cy="398" r="5"/>
  <text class="ink body" x="170" y="402">Office minutes draft</text>
  <text class="muted small" x="170" y="424">cloud ASR running</text>

  <rect class="surface2" x="396" y="204" width="260" height="484" rx="16"/>
  <text class="ink h2" x="420" y="238">Review</text>
  <rect class="selected" x="420" y="268" width="212" height="96" rx="13"/>
  <circle class="green" cx="440" cy="292" r="5"/>
  <text class="ink body" x="454" y="296">BTC thesis loop</text>
  <text class="muted small" x="454" y="318">evidence ready</text>
  <text class="muted small" x="454" y="338">prices snapshot empty</text>
  <rect class="surface" x="420" y="382" width="212" height="96" rx="13"/>
  <circle class="green" cx="440" cy="406" r="5"/>
  <text class="ink body" x="454" y="410">Company deep dive</text>
  <text class="muted small" x="454" y="432">draft ready</text>

  <rect class="surface2" x="680" y="204" width="260" height="484" rx="16"/>
  <text class="ink h2" x="704" y="238">Completed</text>
  <rect class="surface" x="704" y="268" width="212" height="88" rx="13"/>
  <circle class="green" cx="724" cy="292" r="5"/>
  <text class="ink body" x="738" y="296">Meeting summary</text>
  <text class="muted small" x="738" y="318">ready for delivery</text>

  <rect class="surface" x="1016" y="112" width="340" height="640" rx="18"/>
  <text class="muted small" x="1044" y="146">SELECTED LOOP</text>
  <text class="ink h2" x="1044" y="176">BTC thesis loop</text>
  <text class="muted body" x="1044" y="204">Final answer preview from read model.</text>
  <rect class="surface2" x="1044" y="236" width="284" height="152" rx="14"/>
  <text class="ink h2" x="1066" y="266">Review gate</text>
  <text class="muted body" x="1066" y="296">CMC result usable</text>
  <text class="muted body" x="1066" y="322">Prices blocked unless returned</text>
  <text class="muted body" x="1066" y="348">Mutations confirmation required</text>
  <rect class="selected" x="1044" y="418" width="126" height="38" rx="12"/>
  <text class="blue body" x="1078" y="442">Review</text>
  <rect class="pill" x="1184" y="418" width="126" height="38" rx="12"/>
  <text class="ink body" x="1210" y="442">Continue</text>

  <rect class="surface" x="84" y="778" width="1272" height="74" rx="17"/>
  <text class="muted body" x="112" y="824">Quick composer: run a new loop or continue selected review item...</text>
  <rect class="selected" x="1218" y="794" width="92" height="38" rx="12"/>
  <text class="blue body" x="1248" y="818">Run</text>
</svg>
