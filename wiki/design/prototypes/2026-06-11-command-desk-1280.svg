<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Command Desk compact prototype</title>
  <desc id="desc">Compact 1280 version of the integrated Agent command desk.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f7f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #8fbaff; stroke-width: 1; }
      .ink { fill: #1d1d20; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .blue { fill: #0a84ff; }
      .green { fill: #34c759; }
      .amber { fill: #ff9f0a; }
      .title { font-size: 23px; font-weight: 650; }
      .h2 { font-size: 17px; font-weight: 650; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .shadow { filter: drop-shadow(0 12px 24px rgba(18, 24, 38, .08)); }
    </style>
  </defs>
  <rect width="1280" height="800" class="bg"/>
  <rect x="22" y="22" width="1236" height="756" rx="26" class="panel shadow"/>

  <rect x="50" y="50" width="164" height="700" rx="20" class="soft"/>
  <text x="78" y="90" class="ink title">looloomi</text>
  <rect x="74" y="132" width="112" height="36" rx="11" class="selected"/>
  <text x="130" y="155" text-anchor="middle" class="ink small" font-weight="650">工作台</text>
  <text x="96" y="214" class="muted body">历史</text>
  <text x="96" y="262" class="muted body">设置</text>

  <rect x="238" y="50" width="274" height="700" rx="20" class="soft"/>
  <text x="266" y="90" class="ink h2">任务栈</text>
  <rect x="266" y="124" width="218" height="76" rx="15" class="selected"/>
  <circle cx="286" cy="151" r="5" class="green"/>
  <text x="302" y="156" class="ink small" font-weight="650">BTC 宏观复核</text>
  <text x="302" y="178" class="muted tiny">CMC result ready</text>
  <rect x="266" y="214" width="218" height="72" rx="15" class="panel"/>
  <circle cx="286" cy="241" r="5" class="amber"/>
  <text x="302" y="246" class="ink small" font-weight="650">产品例会提要</text>
  <text x="302" y="268" class="muted tiny">needs review</text>
  <text x="266" y="352" class="ink h2">快捷任务</text>
  <rect x="266" y="382" width="218" height="38" rx="12" class="panel"/>
  <text x="288" y="406" class="ink small">复核 crypto thesis</text>
  <rect x="266" y="434" width="218" height="38" rx="12" class="panel"/>
  <text x="288" y="458" class="ink small">写会议提要</text>
  <rect x="266" y="486" width="218" height="38" rx="12" class="panel"/>
  <text x="288" y="510" class="ink small">继续追问</text>

  <rect x="540" y="50" width="674" height="514" rx="22" class="panel"/>
  <text x="572" y="92" class="muted tiny">CURRENT RESULT</text>
  <text x="572" y="124" class="ink title">BTC 宏观复核</text>
  <rect x="572" y="150" width="124" height="28" rx="10" fill="#eaf8ee"/>
  <text x="634" y="169" text-anchor="middle" class="ink tiny" font-weight="650">CMC ready</text>
  <rect x="708" y="150" width="126" height="28" rx="10" fill="#fff5e5"/>
  <text x="771" y="169" text-anchor="middle" class="ink tiny" font-weight="650">prices limited</text>
  <rect x="572" y="214" width="588" height="184" rx="17" class="soft"/>
  <text x="600" y="250" class="ink h2">市场阅读</text>
  <text x="600" y="282" class="ink body">CMC 返回摘要支持继续观察 ETF 流、美元流动性和链上风险偏好。</text>
  <text x="600" y="312" class="ink body">本轮不生成入场或支撑阻力。</text>
  <text x="600" y="360" class="muted small">继续追问会沿用当前任务上下文。</text>
  <rect x="572" y="434" width="150" height="36" rx="12" class="panel"/>
  <text x="647" y="457" text-anchor="middle" class="ink small">加入 ETF 流</text>
  <rect x="736" y="434" width="150" height="36" rx="12" class="panel"/>
  <text x="811" y="457" text-anchor="middle" class="ink small">解释风险</text>

  <rect x="540" y="590" width="674" height="118" rx="22" class="panel shadow"/>
  <rect x="572" y="616" width="132" height="32" rx="11" class="selected"/>
  <text x="638" y="637" text-anchor="middle" class="ink small" font-weight="650">Crypto</text>
  <rect x="716" y="616" width="132" height="32" rx="11" class="soft"/>
  <text x="782" y="637" text-anchor="middle" class="muted small">Office</text>
  <text x="572" y="684" class="muted body">继续问：把这个结论变成一个跟进任务...</text>
  <rect x="1060" y="652" width="104" height="40" rx="14" class="blue"/>
  <text x="1112" y="677" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">发送</text>
</svg>
