<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Block Rail Workbench 1280 prototype</title>
  <desc id="desc">Compact 1280 width adaptation of the recommended Blocks Workbench.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .sidebar { fill: #eceff3; }
      .surface { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .surface2 { fill: #f8f9fb; stroke: #d9dee7; stroke-width: 1; }
      .selected { fill: #edf4ff; stroke: #7aa7f8; stroke-width: 1.5; }
      .ink { fill: #1f2329; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .blue { fill: #2563eb; }
      .green { fill: #168a4a; }
      .amber { fill: #a16207; }
      .pill { fill: #eef2f7; stroke: #d6dce6; stroke-width: 1; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; font-weight: 500; }
      .small { font-size: 10px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="800"/>
  <rect class="sidebar" x="0" y="0" width="68" height="800"/>
  <rect class="surface" x="92" y="24" width="1116" height="50" rx="15"/>
  <text class="muted body" x="120" y="56">搜索 loop、结果、草稿...</text>
  <rect class="surface" x="92" y="96" width="1116" height="92" rx="17"/>
  <text class="ink h1" x="118" y="138">Blocks Workbench</text>
  <text class="muted body" x="118" y="164">Crypto、Markets、Office 的垂直 loop 工作台。</text>
  <rect class="selected" x="1062" y="124" width="112" height="32" rx="12"/>
  <text class="blue body" x="1090" y="145">Run loop</text>

  <rect class="surface" x="92" y="208" width="300" height="440" rx="17"/>
  <text class="ink h2" x="116" y="240">Blocks</text>
  <rect class="selected" x="116" y="258" width="252" height="56" rx="13"/>
  <text class="ink h2" x="136" y="282">Crypto</text>
  <text class="muted small" x="136" y="301">Market scan, thesis review</text>
  <rect class="surface2" x="116" y="326" width="252" height="56" rx="13"/>
  <text class="ink h2" x="136" y="350">Markets</text>
  <text class="muted small" x="136" y="369">Company, earnings, macro</text>
  <rect class="surface2" x="116" y="394" width="252" height="56" rx="13"/>
  <text class="ink h2" x="136" y="418">Office</text>
  <text class="muted small" x="136" y="437">Minutes, docs, delivery</text>
  <text class="ink h2" x="116" y="492">Templates</text>
  <rect class="pill" x="116" y="510" width="112" height="32" rx="11"/>
  <text class="ink body" x="134" y="531">Market scan</text>
  <rect class="pill" x="238" y="510" width="116" height="32" rx="11"/>
  <text class="ink body" x="254" y="531">Thesis review</text>
  <text class="ink h2" x="116" y="584">Active</text>
  <rect class="selected" x="116" y="602" width="252" height="52" rx="13"/>
  <circle class="green" cx="136" cy="628" r="5"/>
  <text class="ink body" x="150" y="625">BTC thesis loop</text>
  <text class="muted small" x="150" y="642">completed · review</text>

  <rect class="surface" x="414" y="208" width="794" height="440" rx="17"/>
  <text class="muted small" x="442" y="240">CRYPTO RESULT CANVAS</text>
  <text class="ink h1" x="442" y="274">BTC thesis loop</text>
  <text class="muted body" x="442" y="300">Final answer from AgentFinalReadModel.finalText</text>
  <rect class="surface2" x="442" y="332" width="338" height="128" rx="14"/>
  <text class="ink h2" x="464" y="360">CMC returned result</text>
  <text class="muted body" x="464" y="388">展示 Skill Hub 可读结果，不新增价位。</text>
  <text class="muted body" x="464" y="414">价格快照为空时只显示数据说明。</text>
  <rect class="surface2" x="802" y="332" width="338" height="128" rx="14"/>
  <text class="ink h2" x="824" y="360">Next actions</text>
  <text class="muted body" x="824" y="388">Review evidence</text>
  <text class="muted body" x="824" y="414">Follow up cross-asset read</text>
  <rect class="selected" x="442" y="492" width="108" height="34" rx="12"/>
  <text class="blue body" x="470" y="514">Review</text>
  <rect class="pill" x="562" y="492" width="114" height="34" rx="12"/>
  <text class="ink body" x="586" y="514">Follow-up</text>

  <rect class="surface" x="92" y="668" width="1116" height="86" rx="17"/>
  <text class="ink h2" x="118" y="700">Loop Composer</text>
  <rect class="surface2" x="256" y="686" width="780" height="40" rx="13"/>
  <text class="muted body" x="280" y="712">输入 /add 选择 Crypto loop，或继续追问当前结果...</text>
  <rect class="selected" x="1054" y="686" width="112" height="40" rx="13"/>
  <text class="blue body" x="1092" y="712">Run</text>
</svg>
