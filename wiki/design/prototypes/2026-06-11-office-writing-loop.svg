<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Office Writing Loop prototype</title>
  <desc id="desc">Office writing loop with file drop, meeting summary draft, revision actions, and Feishu preview.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f7f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #8fbaff; stroke-width: 1; }
      .ink { fill: #1d1d20; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .blue { fill: #0a84ff; }
      .green { fill: #34c759; }
      .amber { fill: #ff9f0a; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 18px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .shadow { filter: drop-shadow(0 14px 30px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect width="1440" height="900" class="bg"/>
  <rect x="24" y="24" width="1392" height="852" rx="28" class="panel shadow"/>

  <rect x="60" y="64" width="300" height="756" rx="22" class="soft"/>
  <text x="92" y="108" class="ink h2">Office 快捷任务</text>
  <rect x="92" y="148" width="236" height="44" rx="14" class="selected"/>
  <text x="210" y="176" text-anchor="middle" class="ink small" font-weight="650">写会议提要</text>
  <rect x="92" y="208" width="236" height="44" rx="14" class="panel"/>
  <text x="210" y="236" text-anchor="middle" class="ink small">提取行动项</text>
  <rect x="92" y="268" width="236" height="44" rx="14" class="panel"/>
  <text x="210" y="296" text-anchor="middle" class="ink small">写 PRD</text>
  <rect x="92" y="328" width="236" height="44" rx="14" class="panel"/>
  <text x="210" y="356" text-anchor="middle" class="ink small">改写文档</text>

  <text x="92" y="456" class="muted small">拖入材料</text>
  <rect x="92" y="482" width="236" height="116" rx="18" class="panel"/>
  <text x="118" y="526" class="ink small" font-weight="650">会议录音 / 图片 / 文档</text>
  <text x="118" y="554" class="muted tiny">拖到 composer 即可开始</text>
  <rect x="92" y="626" width="236" height="58" rx="15" class="panel"/>
  <circle cx="116" cy="656" r="6" class="amber"/>
  <text x="134" y="652" class="ink tiny" font-weight="650">Feishu preview</text>
  <text x="134" y="672" class="muted tiny">确认后交付</text>

  <rect x="392" y="64" width="888" height="596" rx="24" class="panel"/>
  <text x="426" y="108" class="muted tiny">OFFICE DRAFT</text>
  <text x="426" y="144" class="ink title">产品例会提要</text>
  <rect x="426" y="172" width="126" height="30" rx="11" fill="#eaf8ee"/>
  <text x="489" y="192" text-anchor="middle" class="ink tiny" font-weight="650">draft ready</text>
  <rect x="564" y="172" width="126" height="30" rx="11" fill="#fff5e5"/>
  <text x="627" y="192" text-anchor="middle" class="ink tiny" font-weight="650">needs review</text>

  <rect x="426" y="236" width="810" height="310" rx="18" class="soft"/>
  <text x="456" y="276" class="ink h2">会议提要</text>
  <text x="456" y="312" class="ink body">本次会议聚焦 Agent 工作台重构，决定把界面从资料列表改为任务和结果驱动。</text>
  <text x="456" y="350" class="ink h2">行动项</text>
  <text x="456" y="384" class="ink body">1. 重写 PRD 和交互架构。</text>
  <text x="456" y="418" class="ink body">2. 产出 Command Desk、Crypto、Office 三类原型。</text>
  <text x="456" y="452" class="ink body">3. 用户审查后再进入 SwiftUI 实现。</text>
  <text x="456" y="504" class="muted small">复核提示：两个行动项缺少 owner，飞书交付前需要确认目标文档。</text>

  <rect x="426" y="584" width="138" height="38" rx="13" class="blue"/>
  <text x="495" y="608" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">继续改写</text>
  <rect x="580" y="584" width="138" height="38" rx="13" class="panel"/>
  <text x="649" y="608" text-anchor="middle" class="ink small" font-weight="650">复制草稿</text>
  <rect x="734" y="584" width="150" height="38" rx="13" class="panel"/>
  <text x="809" y="608" text-anchor="middle" class="ink small" font-weight="650">飞书预览</text>

  <rect x="392" y="690" width="888" height="106" rx="22" class="panel shadow"/>
  <rect x="426" y="716" width="132" height="32" rx="11" class="soft"/>
  <text x="492" y="737" text-anchor="middle" class="ink small" font-weight="650">添加文件</text>
  <text x="580" y="748" class="muted body">继续改写：把行动项按 owner 和 deadline 整理成表格...</text>
  <rect x="1138" y="724" width="100" height="42" rx="15" class="blue"/>
  <text x="1188" y="751" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">发送</text>
</svg>
