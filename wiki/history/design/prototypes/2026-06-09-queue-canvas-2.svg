<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Queue Canvas 2.0 prototype</title>
  <desc id="desc">Recommended Apple minimal desktop prototype for queue-first unified Agent workbench.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .surface { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .soft { fill: #f1f4f8; stroke: #e2e6ed; stroke-width: 1; }
      .selected { fill: #e9f1ff; stroke: #9ec5ff; stroke-width: 1; }
      .text { fill: #171923; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #687386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 20px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .shadow { filter: drop-shadow(0 14px 28px rgba(15, 23, 42, .08)); }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>

  <rect x="24" y="24" width="78" height="852" rx="26" class="surface shadow"/>
  <rect x="43" y="48" width="40" height="40" rx="13" fill="#0f172a"/>
  <text x="63" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="19" font-weight="700">∞</text>
  <rect x="39" y="130" width="48" height="48" rx="15" class="selected"/>
  <text x="63" y="160" text-anchor="middle" class="text" font-size="18">▦</text>
  <rect x="39" y="198" width="48" height="48" rx="15" class="soft"/>
  <text x="63" y="228" text-anchor="middle" class="muted" font-size="18">▤</text>
  <rect x="39" y="266" width="48" height="48" rx="15" class="soft"/>
  <text x="63" y="296" text-anchor="middle" class="muted" font-size="18">⚙</text>

  <rect x="126" y="24" width="330" height="852" rx="28" class="surface shadow"/>
  <text x="158" y="72" class="text h2">工作队列</text>
  <text x="158" y="98" class="muted small">4 active · 9 total</text>
  <rect x="158" y="126" width="82" height="34" rx="12" class="selected"/>
  <text x="199" y="148" text-anchor="middle" class="text tiny">全部</text>
  <rect x="250" y="126" width="82" height="34" rx="12" class="soft"/>
  <text x="291" y="148" text-anchor="middle" class="muted tiny">运行</text>
  <rect x="342" y="126" width="82" height="34" rx="12" class="soft"/>
  <text x="383" y="148" text-anchor="middle" class="muted tiny">复核</text>

  <rect x="158" y="190" width="266" height="112" rx="18" class="selected"/>
  <circle cx="182" cy="218" r="6" class="blue"/>
  <text x="198" y="223" class="text small" font-weight="650">BTC thesis 复核</text>
  <text x="198" y="250" class="muted tiny">CMC Skill Hub · Review ready</text>
  <text x="198" y="276" class="muted tiny">Final read model available</text>

  <rect x="158" y="318" width="266" height="92" rx="18" class="soft"/>
  <circle cx="182" cy="346" r="6" class="green"/>
  <text x="198" y="351" class="text small" font-weight="650">会议纪要草稿</text>
  <text x="198" y="378" class="muted tiny">Office / Meeting · Draft</text>

  <rect x="158" y="426" width="266" height="92" rx="18" class="soft"/>
  <circle cx="182" cy="454" r="6" class="amber"/>
  <text x="198" y="459" class="text small" font-weight="650">市场观察更新</text>
  <text x="198" y="486" class="muted tiny">Prices empty · Mutations off</text>

  <rect x="158" y="534" width="266" height="92" rx="18" class="soft"/>
  <circle cx="182" cy="562" r="6" class="red"/>
  <text x="198" y="567" class="text small" font-weight="650">外发动作待确认</text>
  <text x="198" y="594" class="muted tiny">Policy blocked</text>

  <rect x="480" y="24" width="936" height="852" rx="30" class="surface shadow"/>
  <rect x="512" y="52" width="872" height="46" rx="16" class="soft"/>
  <text x="536" y="81" class="muted body">Command Search · Context · Runs · Artifacts</text>
  <rect x="1242" y="59" width="118" height="32" rx="12" class="selected"/>
  <text x="1301" y="80" text-anchor="middle" class="text tiny">New task</text>

  <text x="512" y="154" class="text title">BTC thesis 复核</text>
  <text x="512" y="184" class="muted body">ETF 流、跨资产相关性和反证是否支持继续观察空头逻辑。</text>
  <rect x="512" y="214" width="150" height="34" rx="12" fill="#e9f7ef"/>
  <text x="587" y="236" text-anchor="middle" class="text tiny">Evidence usable</text>
  <rect x="674" y="214" width="132" height="34" rx="12" fill="#eff6ff"/>
  <text x="740" y="236" text-anchor="middle" class="text tiny">Review pass</text>
  <rect x="818" y="214" width="136" height="34" rx="12" fill="#fff7ed"/>
  <text x="886" y="236" text-anchor="middle" class="text tiny">Prices empty</text>
  <rect x="966" y="214" width="178" height="34" rx="12" class="soft"/>
  <text x="1055" y="236" text-anchor="middle" class="muted tiny">CMC Skill Hub</text>

  <rect x="512" y="286" width="824" height="258" rx="24" class="soft"/>
  <text x="544" y="330" class="text h2">Final Answer</text>
  <text x="544" y="368" class="text body">CMC Skill Hub 返回的宏观摘要可以展示，但 App 没有独立结构化价格快照。</text>
  <text x="544" y="402" class="muted body">因此本轮保留研究结论，不新增支撑位、阻力位、入场、止损或交易区间。</text>
  <rect x="544" y="444" width="210" height="40" rx="14" class="surface"/>
  <text x="649" y="470" text-anchor="middle" class="muted small">查看 evidence</text>
  <rect x="770" y="444" width="210" height="40" rx="14" class="surface"/>
  <text x="875" y="470" text-anchor="middle" class="muted small">打开 review</text>

  <text x="512" y="602" class="text h2">Deliverables</text>
  <rect x="512" y="628" width="260" height="92" rx="18" class="surface"/>
  <text x="538" y="662" class="text small" font-weight="650">观察结论</text>
  <text x="538" y="690" class="muted tiny">Authoritative final</text>
  <rect x="792" y="628" width="260" height="92" rx="18" class="surface"/>
  <text x="818" y="662" class="text small" font-weight="650">证据摘要</text>
  <text x="818" y="690" class="muted tiny">Task-local detail</text>
  <rect x="1072" y="628" width="264" height="92" rx="18" class="surface"/>
  <text x="1098" y="662" class="text small" font-weight="650">待确认动作</text>
  <text x="1098" y="690" class="muted tiny">No live publish</text>

  <rect x="512" y="760" width="824" height="82" rx="22" class="surface"/>
  <text x="538" y="809" class="muted body">输入后续任务，或添加能力包 / 上下文...</text>
  <rect x="1158" y="780" width="146" height="42" rx="15" class="blue"/>
  <text x="1231" y="807" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">继续任务</text>
</svg>
