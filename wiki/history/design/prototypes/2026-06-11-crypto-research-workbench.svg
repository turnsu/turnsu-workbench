<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Crypto Research Workbench prototype</title>
  <desc id="desc">Crypto research mode prototype with source connector, CMC result status, thesis canvas, and task-local evidence ledger.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f6f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #93bcff; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .green { fill: #30d158; }
      .amber { fill: #ff9f0a; }
      .red { fill: #ff453a; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #697386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 18px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 650; }
      .shadow { filter: drop-shadow(0 12px 28px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect x="28" y="24" width="1384" height="852" rx="28" class="panel shadow"/>

  <rect x="56" y="52" width="208" height="796" rx="22" class="soft"/>
  <text x="84" y="96" class="text title">工作台</text>
  <rect x="84" y="142" width="150" height="36" rx="11" class="selected"/>
  <text x="159" y="165" text-anchor="middle" class="text small" font-weight="650">Crypto Research</text>
  <text x="84" y="220" class="muted body">资料库</text>
  <text x="84" y="270" class="muted body">设置</text>

  <text x="300" y="90" class="text title">Crypto Research Workbench</text>
  <text x="300" y="120" class="muted body">从群消息、Token、watchlist 和 CMC result 发起研究，不暴露底层工具。</text>
  <rect x="1040" y="64" width="116" height="34" rx="12" class="soft"/>
  <text x="1098" y="86" text-anchor="middle" class="muted small">All Work</text>
  <rect x="1166" y="64" width="116" height="34" rx="12" class="selected"/>
  <text x="1224" y="86" text-anchor="middle" class="text small" font-weight="650">Crypto</text>
  <rect x="1292" y="64" width="88" height="34" rx="12" class="soft"/>
  <text x="1336" y="86" text-anchor="middle" class="muted small">Office</text>

  <rect x="300" y="160" width="296" height="590" rx="22" class="soft"/>
  <text x="328" y="198" class="text h2">Sources</text>
  <rect x="328" y="230" width="240" height="72" rx="15" class="panel"/>
  <text x="350" y="257" class="text small" font-weight="650">WeChat Sources</text>
  <text x="350" y="281" class="muted tiny">3 groups · normalized · local</text>
  <rect x="328" y="318" width="240" height="72" rx="15" class="panel"/>
  <text x="350" y="345" class="text small" font-weight="650">Market References</text>
  <text x="350" y="369" class="muted tiny">BTC · ETH · SOL · watchlist</text>
  <rect x="328" y="406" width="240" height="72" rx="15" class="selected"/>
  <text x="350" y="433" class="text small" font-weight="650">CMC Skill Hub</text>
  <text x="350" y="457" class="muted tiny">transport ok · result usable</text>
  <text x="328" y="530" class="text h2">Queue</text>
  <rect x="328" y="562" width="240" height="80" rx="15" class="selected"/>
  <circle cx="350" cy="588" r="6" class="green"/>
  <text x="368" y="593" class="text small" font-weight="650">BTC thesis 复核</text>
  <text x="368" y="618" class="muted tiny">running · prices empty</text>
  <rect x="328" y="656" width="240" height="62" rx="15" class="panel"/>
  <circle cx="350" cy="682" r="6" class="red"/>
  <text x="368" y="687" class="text small" font-weight="650">SOL meme 信号</text>
  <text x="368" y="710" class="muted tiny">blocked · source stale</text>

  <rect x="624" y="160" width="502" height="590" rx="22" class="panel"/>
  <text x="656" y="200" class="muted label">MARKET THESIS</text>
  <text x="656" y="235" class="text title">BTC ETF / 跨资产相关性复核</text>
  <rect x="656" y="264" width="138" height="30" rx="11" fill="#e8f1ff"/>
  <text x="725" y="284" text-anchor="middle" class="text tiny" font-weight="650">transport ok</text>
  <rect x="806" y="264" width="126" height="30" rx="11" fill="#eaf8ee"/>
  <text x="869" y="284" text-anchor="middle" class="text tiny" font-weight="650">result usable</text>
  <rect x="944" y="264" width="126" height="30" rx="11" fill="#fff5e5"/>
  <text x="1007" y="284" text-anchor="middle" class="text tiny" font-weight="650">prices empty</text>

  <rect x="656" y="324" width="430" height="206" rx="18" class="soft"/>
  <text x="684" y="362" class="text h2">Final answer</text>
  <text x="684" y="396" class="text body">Skill Hub 返回的宏观摘要可展示。当前可以继续观察 ETF 流、</text>
  <text x="684" y="424" class="text body">美元流动性和群消息变化，但不生成具体交易价位。</text>
  <text x="684" y="472" class="muted small">数据说明：没有独立结构化价格快照；price gate 仍然阻断 App 生成的支撑/阻力。</text>

  <text x="656" y="584" class="text h2">Actions</text>
  <rect x="656" y="612" width="116" height="38" rx="13" class="blue"/>
  <text x="714" y="636" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">继续研究</text>
  <rect x="786" y="612" width="116" height="38" rx="13" class="panel"/>
  <text x="844" y="636" text-anchor="middle" class="text small" font-weight="650">复制结论</text>
  <rect x="916" y="612" width="138" height="38" rx="13" class="panel"/>
  <text x="985" y="636" text-anchor="middle" class="text small" font-weight="650">加入观察列表</text>

  <rect x="1154" y="160" width="226" height="590" rx="22" class="panel"/>
  <text x="1182" y="198" class="text h2">Evidence Drawer</text>
  <text x="1182" y="224" class="muted tiny">task-local details</text>
  <rect x="1182" y="258" width="170" height="54" rx="14" class="soft"/>
  <circle cx="1204" cy="285" r="5" class="green"/>
  <text x="1220" y="281" class="text tiny" font-weight="650">CMC result</text>
  <text x="1220" y="300" class="muted tiny">usable returned text</text>
  <rect x="1182" y="328" width="170" height="54" rx="14" class="soft"/>
  <circle cx="1204" cy="355" r="5" class="amber"/>
  <text x="1220" y="351" class="text tiny" font-weight="650">Price gate</text>
  <text x="1220" y="370" class="muted tiny">snapshot empty</text>
  <rect x="1182" y="398" width="170" height="54" rx="14" class="soft"/>
  <circle cx="1204" cy="425" r="5" class="green"/>
  <text x="1220" y="421" class="text tiny" font-weight="650">WeChat source</text>
  <text x="1220" y="440" class="muted tiny">1 related group</text>
  <rect x="1182" y="468" width="170" height="54" rx="14" class="soft"/>
  <circle cx="1204" cy="495" r="5" class="red"/>
  <text x="1220" y="491" class="text tiny" font-weight="650">Mutations</text>
  <text x="1220" y="510" class="muted tiny">discarded</text>
  <rect x="1182" y="650" width="170" height="36" rx="12" class="panel"/>
  <text x="1267" y="673" text-anchor="middle" class="text small" font-weight="650">Close Drawer</text>

  <rect x="300" y="782" width="1080" height="58" rx="18" class="panel"/>
  <text x="330" y="818" class="muted body">分析 BTC thesis，加入 WeChat Sources 和 CMC Skill Hub...</text>
  <rect x="1240" y="792" width="110" height="38" rx="13" class="blue"/>
  <text x="1295" y="816" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">开始</text>
</svg>
