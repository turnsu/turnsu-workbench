<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Unified Workstream Desk prototype</title>
  <desc id="desc">Unified macOS workbench prototype for crypto research and office drafting tasks.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .sidebar { fill: #eef1f5; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f6f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #93bcff; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .green { fill: #30d158; }
      .amber { fill: #ff9f0a; }
      .red { fill: #ff453a; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #697386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 18px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 650; }
      .shadow { filter: drop-shadow(0 12px 28px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>

  <rect x="28" y="24" width="236" height="852" rx="24" class="sidebar"/>
  <text x="58" y="70" class="text title">looloomi</text>
  <text x="58" y="100" class="muted small">Unified Agent Workbench</text>
  <rect x="52" y="148" width="188" height="42" rx="12" class="selected"/>
  <text x="80" y="174" class="text body" font-weight="650">工作台</text>
  <rect x="52" y="204" width="188" height="42" rx="12" fill="transparent"/>
  <text x="80" y="230" class="muted body">资料库</text>
  <rect x="52" y="260" width="188" height="42" rx="12" fill="transparent"/>
  <text x="80" y="286" class="muted body">设置</text>
  <rect x="52" y="778" width="188" height="52" rx="16" class="panel"/>
  <circle cx="78" cy="804" r="6" class="green"/>
  <text x="94" y="801" class="text small" font-weight="650">Local runtime</text>
  <text x="94" y="820" class="muted tiny">private · dry-run safe</text>

  <rect x="288" y="24" width="1124" height="852" rx="28" class="panel shadow"/>
  <rect x="320" y="52" width="1060" height="48" rx="16" class="soft"/>
  <text x="346" y="82" class="muted body">搜索任务、Token、群消息、会议、文档...</text>
  <rect x="1174" y="60" width="174" height="32" rx="12" class="blue"/>
  <text x="1261" y="81" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">新建工作</text>

  <text x="320" y="154" class="text title">Unified Workstream Desk</text>
  <text x="320" y="184" class="muted body">所有 Agent 工作从队列进入：crypto research、office draft、source review。</text>
  <rect x="1028" y="130" width="104" height="34" rx="12" class="selected"/>
  <text x="1080" y="152" text-anchor="middle" class="text small">All Work</text>
  <rect x="1142" y="130" width="126" height="34" rx="12" class="soft"/>
  <text x="1205" y="152" text-anchor="middle" class="muted small">Crypto</text>
  <rect x="1278" y="130" width="102" height="34" rx="12" class="soft"/>
  <text x="1329" y="152" text-anchor="middle" class="muted small">Office</text>

  <rect x="320" y="218" width="328" height="536" rx="22" class="soft"/>
  <text x="348" y="254" class="text h2">Workstream Queue</text>
  <text x="348" y="280" class="muted small">按状态恢复工作，不按系统对象浏览。</text>
  <rect x="348" y="314" width="272" height="92" rx="16" class="selected"/>
  <circle cx="370" cy="340" r="6" class="green"/>
  <text x="388" y="345" class="text small" font-weight="650">BTC thesis 复核</text>
  <text x="388" y="370" class="muted tiny">Crypto · running · CMC result usable</text>
  <text x="388" y="390" class="muted tiny">WeChat Sources + Watchlist</text>
  <rect x="348" y="422" width="272" height="84" rx="16" class="panel"/>
  <circle cx="370" cy="448" r="6" class="amber"/>
  <text x="388" y="453" class="text small" font-weight="650">会议纪要草稿</text>
  <text x="388" y="478" class="muted tiny">Office · review-ready · 3 action items</text>
  <rect x="348" y="522" width="272" height="84" rx="16" class="panel"/>
  <circle cx="370" cy="548" r="6" class="red"/>
  <text x="388" y="553" class="text small" font-weight="650">SOL 群消息信号</text>
  <text x="388" y="578" class="muted tiny">Crypto · blocked · prices empty</text>
  <rect x="348" y="622" width="272" height="84" rx="16" class="panel"/>
  <circle cx="370" cy="648" r="6" class="green"/>
  <text x="388" y="653" class="text small" font-weight="650">PRD 文档改写</text>
  <text x="388" y="678" class="muted tiny">Office · completed · local export</text>

  <rect x="676" y="218" width="672" height="536" rx="22" class="panel"/>
  <text x="712" y="258" class="muted label">CURRENT TASK</text>
  <text x="712" y="292" class="text title">复核 BTC 宏观 thesis</text>
  <rect x="712" y="318" width="152" height="30" rx="11" fill="#e8f1ff"/>
  <text x="788" y="338" text-anchor="middle" class="text tiny" font-weight="650">CMC Skill Hub</text>
  <rect x="876" y="318" width="126" height="30" rx="11" fill="#eaf8ee"/>
  <text x="939" y="338" text-anchor="middle" class="text tiny" font-weight="650">result usable</text>
  <rect x="1014" y="318" width="120" height="30" rx="11" fill="#fff5e5"/>
  <text x="1074" y="338" text-anchor="middle" class="text tiny" font-weight="650">prices empty</text>
  <rect x="1146" y="318" width="132" height="30" rx="11" fill="#f1f3f7"/>
  <text x="1212" y="338" text-anchor="middle" class="text tiny" font-weight="650">mutations gated</text>

  <rect x="712" y="382" width="584" height="194" rx="18" class="soft"/>
  <text x="740" y="420" class="text h2">Final answer</text>
  <text x="740" y="454" class="text body">ETF 流、跨资产相关性和群消息信号支持继续观察，</text>
  <text x="740" y="482" class="text body">但本轮没有可独立引用的结构化价格快照。</text>
  <text x="740" y="526" class="muted small">数据说明：展示 Skill Hub 返回摘要；不生成支撑阻力、入场、止损或价格区间。</text>

  <text x="712" y="626" class="text h2">Next actions</text>
  <rect x="712" y="650" width="116" height="38" rx="13" class="blue"/>
  <text x="770" y="674" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">继续研究</text>
  <rect x="842" y="650" width="116" height="38" rx="13" class="panel"/>
  <text x="900" y="674" text-anchor="middle" class="text small" font-weight="650">复制结论</text>
  <rect x="972" y="650" width="142" height="38" rx="13" class="panel"/>
  <text x="1043" y="674" text-anchor="middle" class="text small" font-weight="650">打开 Evidence</text>
  <rect x="1128" y="650" width="142" height="38" rx="13" class="panel"/>
  <text x="1199" y="674" text-anchor="middle" class="text small" font-weight="650">创建跟进</text>

  <rect x="320" y="782" width="1028" height="64" rx="20" class="panel"/>
  <text x="350" y="821" class="muted body">描述目标，或输入 /add 选择 CMC、WeChat Sources、Meeting Docs...</text>
  <rect x="1176" y="794" width="140" height="40" rx="14" class="blue"/>
  <text x="1246" y="819" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">Cmd Return</text>
</svg>
