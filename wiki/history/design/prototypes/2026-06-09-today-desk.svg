<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Today Desk prototype</title>
  <desc id="desc">Apple minimal desktop prototype for the looloomi integrated workbench, Today Desk direction.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .surface { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .soft { fill: #f1f4f8; stroke: #e2e6ed; stroke-width: 1; }
      .selected { fill: #e9f1ff; stroke: #9ec5ff; stroke-width: 1; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .text { fill: #171923; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #687386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .title { font-size: 28px; font-weight: 650; }
      .h2 { font-size: 21px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
      .mono { font-family: "SF Mono", ui-monospace, monospace; font-size: 12px; }
      .shadow { filter: drop-shadow(0 12px 26px rgba(15, 23, 42, .08)); }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>

  <rect x="24" y="24" width="88" height="852" rx="28" class="surface shadow"/>
  <rect x="46" y="48" width="44" height="44" rx="14" fill="#0f172a"/>
  <text x="68" y="77" text-anchor="middle" class="text" fill="#ffffff" font-size="20" font-weight="700">∞</text>
  <rect x="42" y="132" width="52" height="52" rx="16" class="selected"/>
  <text x="68" y="164" text-anchor="middle" class="text" font-size="20">⌘</text>
  <rect x="42" y="204" width="52" height="52" rx="16" class="soft"/>
  <text x="68" y="236" text-anchor="middle" class="muted" font-size="20">◇</text>
  <rect x="42" y="276" width="52" height="52" rx="16" class="soft"/>
  <text x="68" y="308" text-anchor="middle" class="muted" font-size="20">◎</text>
  <rect x="42" y="800" width="52" height="52" rx="16" class="soft"/>
  <text x="68" y="832" text-anchor="middle" class="muted" font-size="20">⚙</text>

  <rect x="136" y="24" width="1280" height="852" rx="30" class="surface shadow"/>
  <rect x="168" y="50" width="1216" height="52" rx="18" class="soft"/>
  <text x="194" y="83" class="muted body">搜索情报、任务、Token、会议草稿...</text>
  <rect x="1060" y="60" width="96" height="32" rx="12" class="surface"/>
  <text x="1108" y="81" text-anchor="middle" class="text small">今日</text>
  <rect x="1168" y="60" width="96" height="32" rx="12" class="selected"/>
  <text x="1216" y="81" text-anchor="middle" class="text small">工作台</text>
  <rect x="1276" y="60" width="84" height="32" rx="12" class="surface"/>
  <text x="1318" y="81" text-anchor="middle" class="muted small">设置</text>

  <text x="172" y="158" class="text title">Today Desk</text>
  <text x="172" y="188" class="muted body">今日重点、活跃队列和一条主命令线，适合开屏进入工作状态。</text>
  <rect x="1140" y="132" width="214" height="44" rx="16" class="selected"/>
  <text x="1247" y="160" text-anchor="middle" class="text small" font-weight="650">新建任务</text>

  <rect x="172" y="226" width="744" height="178" rx="24" class="soft"/>
  <text x="204" y="270" class="text h2">今日重点</text>
  <text x="204" y="302" class="muted body">BTC thesis 复核、会议纪要草稿、两个待复核动作。</text>
  <rect x="204" y="332" width="180" height="38" rx="14" class="surface"/>
  <circle cx="224" cy="351" r="6" class="green"/>
  <text x="240" y="357" class="muted small">4 个可信结果</text>
  <rect x="402" y="332" width="170" height="38" rx="14" class="surface"/>
  <circle cx="422" cy="351" r="6" class="amber"/>
  <text x="438" y="357" class="muted small">2 个需复核</text>
  <rect x="590" y="332" width="186" height="38" rx="14" class="surface"/>
  <circle cx="610" cy="351" r="6" class="blue"/>
  <text x="626" y="357" class="muted small">队列正在运行</text>

  <rect x="944" y="226" width="410" height="178" rx="24" class="surface"/>
  <text x="976" y="266" class="text h2">Active Queue</text>
  <rect x="976" y="292" width="346" height="34" rx="12" class="selected"/>
  <text x="994" y="314" class="text small">分析 BTC ETF / 宏观关联 thesis</text>
  <rect x="976" y="338" width="346" height="34" rx="12" class="soft"/>
  <text x="994" y="360" class="muted small">整理今日会议待办草稿</text>

  <text x="172" y="460" class="text h2">精选工作项</text>
  <g>
    <rect x="172" y="486" width="372" height="156" rx="22" class="surface"/>
    <text x="202" y="526" class="text body" font-weight="650">CMC Skill Hub 结果可展示</text>
    <text x="202" y="558" class="muted small">Result usable · prices empty</text>
    <rect x="202" y="586" width="110" height="30" rx="11" fill="#e9f7ef"/>
    <text x="257" y="606" text-anchor="middle" class="text tiny">Evidence</text>
  </g>
  <g>
    <rect x="568" y="486" width="372" height="156" rx="22" class="surface"/>
    <text x="598" y="526" class="text body" font-weight="650">会议纪要草稿</text>
    <text x="598" y="558" class="muted small">Office / Meeting 能力包 · dry-run</text>
    <rect x="598" y="586" width="110" height="30" rx="11" fill="#fff7ed"/>
    <text x="653" y="606" text-anchor="middle" class="text tiny">Review</text>
  </g>
  <g>
    <rect x="964" y="486" width="390" height="156" rx="22" class="surface"/>
    <text x="994" y="526" class="text body" font-weight="650">待确认动作</text>
    <text x="994" y="558" class="muted small">无外发、无交易、无删除动作</text>
    <rect x="994" y="586" width="110" height="30" rx="11" fill="#eff6ff"/>
    <text x="1049" y="606" text-anchor="middle" class="text tiny">Policy</text>
  </g>

  <rect x="172" y="700" width="1182" height="112" rx="24" class="surface shadow"/>
  <text x="202" y="742" class="muted body">描述一个工作目标，选择上下文或能力包...</text>
  <rect x="202" y="766" width="148" height="32" rx="12" class="soft"/>
  <text x="276" y="787" text-anchor="middle" class="muted tiny">CMC Skill Hub</text>
  <rect x="362" y="766" width="148" height="32" rx="12" class="soft"/>
  <text x="436" y="787" text-anchor="middle" class="muted tiny">Office / Meeting</text>
  <rect x="1194" y="748" width="128" height="42" rx="15" class="blue"/>
  <text x="1258" y="775" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">开始任务</text>
</svg>
