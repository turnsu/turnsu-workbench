<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Queue Canvas 2.0 detail prototype</title>
  <desc id="desc">Detailed recommended direction with task-local evidence drawer open.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .surface { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .soft { fill: #f1f4f8; stroke: #e2e6ed; stroke-width: 1; }
      .selected { fill: #e9f1ff; stroke: #9ec5ff; stroke-width: 1; }
      .text { fill: #171923; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #687386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .title { font-size: 25px; font-weight: 650; }
      .h2 { font-size: 19px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .shadow { filter: drop-shadow(0 14px 28px rgba(15, 23, 42, .08)); }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>

  <rect x="24" y="24" width="72" height="852" rx="26" class="surface shadow"/>
  <rect x="42" y="48" width="36" height="36" rx="12" fill="#0f172a"/>
  <text x="60" y="73" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">∞</text>
  <rect x="38" y="128" width="44" height="44" rx="14" class="selected"/>
  <text x="60" y="156" text-anchor="middle" class="text" font-size="17">▦</text>
  <rect x="38" y="192" width="44" height="44" rx="14" class="soft"/>
  <text x="60" y="220" text-anchor="middle" class="muted" font-size="17">▤</text>
  <rect x="38" y="256" width="44" height="44" rx="14" class="soft"/>
  <text x="60" y="284" text-anchor="middle" class="muted" font-size="17">⚙</text>

  <rect x="118" y="24" width="300" height="852" rx="28" class="surface shadow"/>
  <text x="150" y="72" class="text h2">Queue</text>
  <text x="150" y="98" class="muted small">visible by default</text>
  <rect x="150" y="136" width="236" height="104" rx="18" class="selected"/>
  <circle cx="174" cy="164" r="6" class="blue"/>
  <text x="190" y="169" class="text small" font-weight="650">BTC thesis 复核</text>
  <text x="190" y="196" class="muted tiny">Final · Evidence · Review</text>
  <rect x="150" y="256" width="236" height="82" rx="18" class="soft"/>
  <circle cx="174" cy="284" r="6" class="green"/>
  <text x="190" y="289" class="text small" font-weight="650">Meeting summary</text>
  <text x="190" y="316" class="muted tiny">Draft ready</text>
  <rect x="150" y="354" width="236" height="82" rx="18" class="soft"/>
  <circle cx="174" cy="382" r="6" class="amber"/>
  <text x="190" y="387" class="text small" font-weight="650">Market watch</text>
  <text x="190" y="414" class="muted tiny">Needs evidence</text>

  <rect x="440" y="24" width="614" height="852" rx="30" class="surface shadow"/>
  <rect x="472" y="52" width="550" height="46" rx="16" class="soft"/>
  <text x="496" y="81" class="muted body">Search, command, context, run...</text>

  <text x="472" y="154" class="text title">BTC thesis 复核</text>
  <text x="472" y="184" class="muted body">Authoritative final answer and task-local state.</text>
  <rect x="472" y="214" width="136" height="34" rx="12" fill="#e9f7ef"/>
  <text x="540" y="236" text-anchor="middle" class="text tiny">Result usable</text>
  <rect x="620" y="214" width="126" height="34" rx="12" fill="#fff7ed"/>
  <text x="683" y="236" text-anchor="middle" class="text tiny">Prices empty</text>
  <rect x="758" y="214" width="132" height="34" rx="12" class="soft"/>
  <text x="824" y="236" text-anchor="middle" class="muted tiny">No publish</text>

  <rect x="472" y="290" width="550" height="270" rx="24" class="soft"/>
  <text x="504" y="334" class="text h2">Final Answer</text>
  <text x="504" y="372" class="text body">CMC Skill Hub 返回摘要可展示。本轮没有独立结构化价格快照。</text>
  <text x="504" y="406" class="muted body">App 不新增价格位、支撑阻力或交易区间。mutation 继续保持 discarded。</text>
  <rect x="504" y="464" width="158" height="38" rx="13" class="surface"/>
  <text x="583" y="489" text-anchor="middle" class="muted small">Copy final</text>
  <rect x="676" y="464" width="174" height="38" rx="13" class="surface"/>
  <text x="763" y="489" text-anchor="middle" class="muted small">Open review</text>

  <rect x="472" y="612" width="550" height="190" rx="24" class="surface"/>
  <text x="504" y="654" class="text h2">Command Composer</text>
  <text x="504" y="692" class="muted body">Continue, fork, or add context...</text>
  <rect x="504" y="728" width="118" height="32" rx="12" class="soft"/>
  <text x="563" y="749" text-anchor="middle" class="muted tiny">CMC</text>
  <rect x="634" y="728" width="162" height="32" rx="12" class="soft"/>
  <text x="715" y="749" text-anchor="middle" class="muted tiny">Office / Meeting</text>
  <rect x="862" y="720" width="128" height="42" rx="15" class="blue"/>
  <text x="926" y="747" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">Run</text>

  <rect x="1076" y="24" width="340" height="852" rx="30" class="surface shadow"/>
  <text x="1108" y="72" class="text h2">Task Detail</text>
  <text x="1108" y="98" class="muted small">Opens on demand</text>
  <rect x="1108" y="132" width="276" height="44" rx="14" class="selected"/>
  <text x="1246" y="160" text-anchor="middle" class="text tiny">Evidence</text>
  <rect x="1108" y="196" width="276" height="118" rx="18" class="soft"/>
  <circle cx="1134" cy="228" r="6" class="green"/>
  <text x="1152" y="233" class="text small" font-weight="650">Skill Hub result</text>
  <text x="1152" y="260" class="muted tiny">Displayable summary returned</text>
  <text x="1152" y="286" class="muted tiny">No raw provider details</text>

  <rect x="1108" y="330" width="276" height="118" rx="18" class="soft"/>
  <circle cx="1134" cy="362" r="6" class="amber"/>
  <text x="1152" y="367" class="text small" font-weight="650">Price gate</text>
  <text x="1152" y="394" class="muted tiny">Structured snapshot empty</text>
  <text x="1152" y="420" class="muted tiny">No App-generated levels</text>

  <rect x="1108" y="464" width="276" height="118" rx="18" class="soft"/>
  <circle cx="1134" cy="496" r="6" class="blue"/>
  <text x="1152" y="501" class="text small" font-weight="650">Review branch</text>
  <text x="1152" y="528" class="muted tiny">Read-only branch pass</text>
  <text x="1152" y="554" class="muted tiny">Does not overwrite final</text>

  <rect x="1108" y="614" width="276" height="140" rx="18" class="surface"/>
  <text x="1134" y="650" class="text small" font-weight="650">Policy</text>
  <text x="1134" y="680" class="muted tiny">No trading</text>
  <text x="1134" y="706" class="muted tiny">No WeChat send</text>
  <text x="1134" y="732" class="muted tiny">Feishu dry-run hidden</text>
</svg>
