<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Office Draft Studio prototype</title>
  <desc id="desc">Office draft mode prototype for meeting notes and document writing tasks.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f6f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #93bcff; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .green { fill: #30d158; }
      .amber { fill: #ff9f0a; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #697386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .title { font-size: 26px; font-weight: 650; }
      .h2 { font-size: 18px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 650; }
      .shadow { filter: drop-shadow(0 12px 28px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect x="28" y="24" width="1384" height="852" rx="28" class="panel shadow"/>

  <rect x="56" y="52" width="208" height="796" rx="22" class="soft"/>
  <text x="84" y="96" class="text title">工作台</text>
  <text x="84" y="158" class="muted body">All Work</text>
  <text x="84" y="208" class="muted body">Crypto Research</text>
  <rect x="84" y="234" width="150" height="36" rx="11" class="selected"/>
  <text x="159" y="257" text-anchor="middle" class="text small" font-weight="650">Office Draft</text>
  <text x="84" y="326" class="muted body">资料库</text>
  <text x="84" y="376" class="muted body">设置</text>

  <text x="300" y="90" class="text title">Office Draft Studio</text>
  <text x="300" y="120" class="muted body">从会议、文档和 source pack 生成可复核草稿；Feishu 只做 task-local dry-run preview。</text>
  <rect x="1038" y="64" width="116" height="34" rx="12" class="soft"/>
  <text x="1096" y="86" text-anchor="middle" class="muted small">All Work</text>
  <rect x="1164" y="64" width="116" height="34" rx="12" class="soft"/>
  <text x="1222" y="86" text-anchor="middle" class="muted small">Crypto</text>
  <rect x="1290" y="64" width="90" height="34" rx="12" class="selected"/>
  <text x="1335" y="86" text-anchor="middle" class="text small" font-weight="650">Office</text>

  <rect x="300" y="160" width="296" height="590" rx="22" class="soft"/>
  <text x="328" y="198" class="text h2">Source Pack</text>
  <rect x="328" y="230" width="240" height="72" rx="15" class="selected"/>
  <text x="350" y="257" class="text small" font-weight="650">产品例会 transcript</text>
  <text x="350" y="281" class="muted tiny">34 min · local ASR · 12 speakers</text>
  <rect x="328" y="318" width="240" height="72" rx="15" class="panel"/>
  <text x="350" y="345" class="text small" font-weight="650">PRD 草稿 v2</text>
  <text x="350" y="369" class="muted tiny">document source · selected</text>
  <rect x="328" y="406" width="240" height="72" rx="15" class="panel"/>
  <text x="350" y="433" class="text small" font-weight="650">行动项上下文</text>
  <text x="350" y="457" class="muted tiny">tasks · owner placeholders</text>
  <text x="328" y="530" class="text h2">Queue</text>
  <rect x="328" y="562" width="240" height="80" rx="15" class="selected"/>
  <circle cx="350" cy="588" r="6" class="amber"/>
  <text x="368" y="593" class="text small" font-weight="650">整理会议纪要</text>
  <text x="368" y="618" class="muted tiny">review-ready · 3 actions</text>
  <rect x="328" y="656" width="240" height="62" rx="15" class="panel"/>
  <circle cx="350" cy="682" r="6" class="green"/>
  <text x="368" y="687" class="text small" font-weight="650">改写项目 PRD</text>
  <text x="368" y="710" class="muted tiny">completed · local draft</text>

  <rect x="624" y="160" width="502" height="590" rx="22" class="panel"/>
  <text x="656" y="200" class="muted label">DRAFT DELIVERABLE</text>
  <text x="656" y="235" class="text title">产品例会纪要</text>
  <rect x="656" y="264" width="126" height="30" rx="11" fill="#e8f1ff"/>
  <text x="719" y="284" text-anchor="middle" class="text tiny" font-weight="650">Meeting Notes</text>
  <rect x="794" y="264" width="126" height="30" rx="11" fill="#eaf8ee"/>
  <text x="857" y="284" text-anchor="middle" class="text tiny" font-weight="650">source covered</text>
  <rect x="932" y="264" width="128" height="30" rx="11" fill="#fff5e5"/>
  <text x="996" y="284" text-anchor="middle" class="text tiny" font-weight="650">needs review</text>

  <rect x="656" y="324" width="430" height="286" rx="18" class="soft"/>
  <text x="684" y="362" class="text h2">会议结论</text>
  <text x="684" y="396" class="text body">1. 本周优先收敛 Agent 工作台主路径。</text>
  <text x="684" y="428" class="text body">2. Crypto 与 Office 任务进入统一队列。</text>
  <text x="684" y="460" class="text body">3. 调试面板退到诊断入口，证据按任务展开。</text>
  <text x="684" y="510" class="text h2">行动项</text>
  <text x="684" y="542" class="text body">- 输出 PRD 与 3 个原型方向。</text>
  <text x="684" y="574" class="text body">- 用户确认后再进入 SwiftUI 实现。</text>

  <text x="656" y="664" class="text h2">Actions</text>
  <rect x="656" y="692" width="116" height="38" rx="13" class="blue"/>
  <text x="714" y="716" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">继续改写</text>
  <rect x="786" y="692" width="116" height="38" rx="13" class="panel"/>
  <text x="844" y="716" text-anchor="middle" class="text small" font-weight="650">复制草稿</text>
  <rect x="916" y="692" width="138" height="38" rx="13" class="panel"/>
  <text x="985" y="716" text-anchor="middle" class="text small" font-weight="650">导出本地</text>

  <rect x="1154" y="160" width="226" height="590" rx="22" class="panel"/>
  <text x="1182" y="198" class="text h2">Draft Review</text>
  <text x="1182" y="224" class="muted tiny">task-local review sheet</text>
  <rect x="1182" y="258" width="170" height="58" rx="14" class="soft"/>
  <circle cx="1204" cy="287" r="5" class="green"/>
  <text x="1220" y="283" class="text tiny" font-weight="650">Source coverage</text>
  <text x="1220" y="302" class="muted tiny">transcript + doc</text>
  <rect x="1182" y="332" width="170" height="58" rx="14" class="soft"/>
  <circle cx="1204" cy="361" r="5" class="amber"/>
  <text x="1220" y="357" class="text tiny" font-weight="650">Open questions</text>
  <text x="1220" y="376" class="muted tiny">2 owner gaps</text>
  <rect x="1182" y="406" width="170" height="58" rx="14" class="soft"/>
  <circle cx="1204" cy="435" r="5" class="green"/>
  <text x="1220" y="431" class="text tiny" font-weight="650">Local export</text>
  <text x="1220" y="450" class="muted tiny">ready</text>
  <rect x="1182" y="480" width="170" height="58" rx="14" class="soft"/>
  <circle cx="1204" cy="509" r="5" class="amber"/>
  <text x="1220" y="505" class="text tiny" font-weight="650">Channel preview</text>
  <text x="1220" y="524" class="muted tiny">Feishu dry-run only</text>
  <rect x="1182" y="650" width="170" height="36" rx="12" class="panel"/>
  <text x="1267" y="673" text-anchor="middle" class="text small" font-weight="650">Close Review</text>

  <rect x="300" y="782" width="1080" height="58" rx="18" class="panel"/>
  <text x="330" y="818" class="muted body">整理这次会议纪要，加入 transcript、PRD 草稿和行动项上下文...</text>
  <rect x="1240" y="792" width="110" height="38" rx="13" class="blue"/>
  <text x="1295" y="816" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="650">开始</text>
</svg>
