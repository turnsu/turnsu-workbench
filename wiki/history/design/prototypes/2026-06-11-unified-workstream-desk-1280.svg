<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Unified Workstream Desk 1280 prototype</title>
  <desc id="desc">Compact 1280 desktop adaptation of the unified workstream desk.</desc>
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .sidebar { fill: #eef1f5; stroke: #d9dee7; stroke-width: 1; }
      .soft { fill: #f6f8fb; stroke: #e1e5ec; stroke-width: 1; }
      .selected { fill: #e8f1ff; stroke: #93bcff; stroke-width: 1; }
      .blue { fill: #0a84ff; }
      .green { fill: #30d158; }
      .amber { fill: #ff9f0a; }
      .red { fill: #ff453a; }
      .text { fill: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      .muted { fill: #697386; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .tiny { font-size: 11px; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .title { font-size: 23px; font-weight: 650; }
      .h2 { font-size: 17px; font-weight: 650; }
      .label { font-size: 11px; font-weight: 650; }
      .shadow { filter: drop-shadow(0 10px 24px rgba(18, 24, 38, .08)); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="800"/>
  <rect x="22" y="22" width="204" height="756" rx="22" class="sidebar"/>
  <text x="50" y="64" class="text title">looloomi</text>
  <rect x="44" y="126" width="158" height="38" rx="12" class="selected"/>
  <text x="70" y="150" class="text body" font-weight="650">工作台</text>
  <text x="70" y="202" class="muted body">资料库</text>
  <text x="70" y="254" class="muted body">设置</text>
  <rect x="44" y="700" width="158" height="42" rx="14" class="panel"/>
  <circle cx="68" cy="721" r="5" class="green"/>
  <text x="82" y="726" class="text small" font-weight="650">Local runtime</text>

  <rect x="248" y="22" width="1010" height="756" rx="26" class="panel shadow"/>
  <rect x="278" y="48" width="950" height="44" rx="15" class="soft"/>
  <text x="302" y="76" class="muted body">搜索任务、Token、会议、文档...</text>
  <text x="278" y="140" class="text title">Unified Workstream Desk</text>
  <rect x="900" y="116" width="88" height="32" rx="11" class="selected"/>
  <text x="944" y="137" text-anchor="middle" class="text small">All</text>
  <rect x="998" y="116" width="94" height="32" rx="11" class="soft"/>
  <text x="1045" y="137" text-anchor="middle" class="muted small">Crypto</text>
  <rect x="1102" y="116" width="94" height="32" rx="11" class="soft"/>
  <text x="1149" y="137" text-anchor="middle" class="muted small">Office</text>

  <rect x="278" y="184" width="284" height="456" rx="20" class="soft"/>
  <text x="304" y="218" class="text h2">Queue</text>
  <rect x="304" y="248" width="232" height="78" rx="15" class="selected"/>
  <circle cx="324" cy="273" r="5" class="green"/>
  <text x="340" y="277" class="text small" font-weight="650">BTC thesis 复核</text>
  <text x="340" y="300" class="muted tiny">Crypto · running</text>
  <rect x="304" y="340" width="232" height="72" rx="15" class="panel"/>
  <circle cx="324" cy="365" r="5" class="amber"/>
  <text x="340" y="369" class="text small" font-weight="650">会议纪要草稿</text>
  <text x="340" y="392" class="muted tiny">Office · review-ready</text>
  <rect x="304" y="426" width="232" height="72" rx="15" class="panel"/>
  <circle cx="324" cy="451" r="5" class="red"/>
  <text x="340" y="455" class="text small" font-weight="650">SOL 群消息信号</text>
  <text x="340" y="478" class="muted tiny">Blocked · prices empty</text>

  <rect x="586" y="184" width="610" height="456" rx="20" class="panel"/>
  <text x="616" y="222" class="muted label">CURRENT TASK</text>
  <text x="616" y="252" class="text title">复核 BTC 宏观 thesis</text>
  <rect x="616" y="278" width="128" height="28" rx="10" fill="#e8f1ff"/>
  <text x="680" y="297" text-anchor="middle" class="text tiny" font-weight="650">CMC Skill Hub</text>
  <rect x="754" y="278" width="110" height="28" rx="10" fill="#eaf8ee"/>
  <text x="809" y="297" text-anchor="middle" class="text tiny" font-weight="650">result usable</text>
  <rect x="874" y="278" width="104" height="28" rx="10" fill="#fff5e5"/>
  <text x="926" y="297" text-anchor="middle" class="text tiny" font-weight="650">prices empty</text>
  <rect x="616" y="340" width="520" height="154" rx="17" class="soft"/>
  <text x="642" y="376" class="text h2">Final answer</text>
  <text x="642" y="407" class="text body">继续观察 ETF 流、跨资产相关性和群消息信号。</text>
  <text x="642" y="433" class="text body">本轮不输出 App 生成的具体价位。</text>
  <text x="642" y="474" class="muted small">Evidence / Review / Source 按需打开，不常驻。</text>
  <rect x="616" y="530" width="108" height="36" rx="12" class="blue"/>
  <text x="670" y="553" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="650">继续研究</text>
  <rect x="738" y="530" width="118" height="36" rx="12" class="panel"/>
  <text x="797" y="553" text-anchor="middle" class="text small" font-weight="650">Evidence</text>

  <rect x="278" y="668" width="918" height="56" rx="18" class="panel"/>
  <text x="306" y="703" class="muted body">描述目标，或输入 /add 选择 source 与能力包...</text>
  <rect x="1062" y="678" width="104" height="36" rx="13" class="blue"/>
  <text x="1114" y="701" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="650">开始</text>
</svg>
